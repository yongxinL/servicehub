services:
    # routetraefik — Traefik v3 edge router / reverse proxy + TLS. Docs: shared/traefik/README.md
    routetraefik:
        build:
            context: ../shared/traefik/
        command:
            # Disable sending anonymous usage data to the Traefik maintainers
            - "--global.sendAnonymousUsage=false"
            # Check for newer Traefik versions
            - "--global.checkNewVersion=false"
            # Enable the built-in API and web-based dashboard
            - "--api=true"
            # Enable the /ping endpoint so we can health-check Traefik
            - "--ping=true"
            # Define the primary HTTP entry point on port 80
            - "--entryPoints.web.address=:80"
            # Define the secure (HTTPS) entry point on port 443
            - "--entryPoints.websecure.address=:443"
            # force redirection of incoming from web to websecure
            - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
            - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
            - "--entrypoints.web.http.redirections.entryPoint.priority=100"
            # Set the IPs or CIDR for where Treafik trusts the forwarded headers
            - "--entryPoints.web.forwardedHeaders.trustedIPs=${TRUSTED_IP}"
            - "--entryPoints.websecure.forwardedHeaders.trustedIPs=${TRUSTED_IP}"
            # Allow long file transfers and encoded WebDAV path characters for oCIS.
            - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=12h"
            - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=12h"
            - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=3m"
            - "--entrypoints.websecure.http.encodedCharacters.allowEncodedSlash=true"
            - "--entrypoints.websecure.http.encodedCharacters.allowEncodedQuestionMark=true"
            - "--entrypoints.websecure.http.encodedCharacters.allowEncodedPercent=true"
            # Enable the Docker provider to detect containers and their labels
            - "--providers.docker=true"
            # Prevent automatic exposure of all containers; only expose containers
            - "--providers.docker.exposedbydefault=false"
            # file provider configuration
            - "--providers.file.directory=/traefik/config/advanced"
            # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
            - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
            # The email address used by Let's Encrypt for renewal notices
            - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACMEMAIL}"
            # The file where ACME certificates are stored inside the container
            - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
            # activate access logging with JSON format for Grafana Alloy/Loki
            - "--accesslog=true"
            - "--accesslog.format=json"
            # Enable Prometheus metrics exporter with entrypoint/service labels
            - "--metrics.prometheus=true"
            - "--metrics.prometheus.addEntryPointsLabels=true"
            - "--metrics.prometheus.addServicesLabels=true"
            # Extract X-Forwarded-For header as client_ip label
            - "--metrics.prometheus.headerlabels.client_ip=X-Forwarded-For"
            # Set the log level (DEBUG, INFO, WARN, ERROR)
            - "--log.level=INFO"
        environment:
            - TZ=${TIME_ZONE}
        healthcheck:
            test: [ "CMD", "traefik", "healthcheck", "--ping" ]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 5s
        image: routetraefik:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.dashboard.entrypoints=websecure"
            # ADR-009: the dashboard host only matches trusted client addresses;
            # the IP allow list and basic auth below remain as defence in depth.
            # The ClientIP list MUST mirror TRUSTED_IP in .env — Traefik rule
            # syntax cannot read the comma-separated allow-list value, so keep
            # both in step whenever the trusted ranges change.
            - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`) && (ClientIP(`127.0.0.0/8`) || ClientIP(`10.0.0.0/8`) || ClientIP(`172.16.0.0/12`) || ClientIP(`192.168.0.0/16`) || ClientIP(`fe80::/10`) || ClientIP(`::1/128`))"
            # Define the internal service for routing
            - "traefik.http.routers.dashboard.service=api@internal"
            # Trusted router outranks the redirect fallback below.
            - "traefik.http.routers.dashboard.priority=300"
            # Enable TLS on this router
            - "traefik.http.routers.dashboard.tls=true"
            # uncomment for basicAuth
            # all dollar signs in the hash need to be double for escaping.
            # to create a user:password pair, the following command can be used
            # echo $(htpasswd -nb user "password") | sed -e s/\\$/\\$\\$/g
            - "traefik.http.routers.dashboard.middlewares=secure-chain@file,dashboard-whitelist,dashboard-auth"
            - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_BAAUTH}"
            # uncomment for middleware-limiting clients to specific IPs, disabled when Forward-Auth enabled.
            # - "traefik.http.routers.dashboard.middlewares=dashboard-whitelist"
            - "traefik.http.middlewares.dashboard-whitelist.ipallowlist.sourcerange=${TRUSTED_IP}"
            # uncomment when Domain Level Forward Authentication enabled in Authentik
            # - "traefik.http.routers.dashboard.middlewares=authentik-forwardauth@file"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.dashboard.tls.certresolver=${CERTRESOLVER}"
            # ADR-009: any other client on the admin host is redirected to the
            # identity login page instead of receiving an HTTP 403 response.
            # The redirect short-circuits before the service is reached.
            - "traefik.http.routers.dashboard-untrusted.entrypoints=websecure"
            - "traefik.http.routers.dashboard-untrusted.rule=Host(`${TRAEFIK_DOMAIN}`)"
            - "traefik.http.routers.dashboard-untrusted.service=api@internal"
            - "traefik.http.routers.dashboard-untrusted.priority=100"
            - "traefik.http.routers.dashboard-untrusted.tls=true"
            - "traefik.http.routers.dashboard-untrusted.middlewares=secure-chain@file,dashboard-login-redirect"
            - "traefik.http.routers.dashboard-untrusted.tls.certresolver=${CERTRESOLVER}"
            - "traefik.http.middlewares.dashboard-login-redirect.redirectregex.regex=^https?://.*"
            - "traefik.http.middlewares.dashboard-login-redirect.redirectregex.replacement=https://${IDENTITY_DOMAIN}"
            - "traefik.http.middlewares.dashboard-login-redirect.redirectregex.permanent=false"
        networks:
            - subnet
        ports:
            - 80:80
            - 443:443
        privileged: true
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ../shared/traefik/advanced:/traefik/config/advanced:ro
            - ${APPS_DATA}/shared/certs:/letsencrypt
