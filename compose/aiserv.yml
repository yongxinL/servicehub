services:
    # aiservhermesinit — one-shot: set ownership of the Hermes data dir. Docs: shared/hermesagent/README.md
    aiservhermesinit:
        command: >
            sh -c 'chown -R 10000:10000 /data00;
                   chmod -R 775 /data00'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${HERMES_DATA_00:-${APPS_DATA}/aiserv/hermes/00}:/data00

    # aiservhermes — Hermes Agent (single shared agent). Docs: shared/hermesagent/README.md
    aiservhermes:
        build:
            context: ../shared/hermesagent/
        depends_on:
            aiservhermesinit:
                condition: service_completed_successfully
        environment:
            - TZ=${TIME_ZONE}
            - HOME=/opt/data
            # Internal workspace port is always 12320; external port mapped via 'ports' below.
            - HERMES_WORKSPACE_PORT=12320
            - LITELLM_API_KEY=${AIGATE_API_KEY}
            - LITELLM_API_URL=${AIGATE_API_URL:-http://aiservlitellm:12380/v1}
            - FIRECRAWL_API_URL=${FCRW_API_URL:-http://aiservfastcrw:12360}
            - FIRECRAWL_API_KEY=${AIGATE_API_KEY}
            - API_SERVER_ENABLED=true
            - API_SERVER_KEY=${AIGATE_API_KEY}
            - API_SERVER_PORT=12330
            - API_SERVER_HOST=0.0.0.0
            - HERMES_WORKSPACE_PASSWORD=${HERMES_WORKSPACE_PASSWD_00}
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:12330/health" ]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        image: aiservhermes:latest
        networks:
            - subnet
        ports:
            - "12320:12320"    # Hermes workspace
        restart: unless-stopped
        volumes:
            - ${HERMES_DATA_00:-${APPS_DATA}/aiserv/hermes/00}:/opt/data
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.aiservhermes.enabled=${HERMES_WORKSPACE_DOMAIN_00:+true}"
            - "traefik.http.routers.aiservhermes.rule=Host(`${HERMES_WORKSPACE_DOMAIN_00}`)"
            - "traefik.http.routers.aiservhermes.tls=true"
            - "traefik.http.routers.aiservhermes.middlewares=secure-chain@file"
            - "traefik.http.routers.aiservhermes.tls.certresolver=${CERTRESOLVER}"
            - "traefik.http.services.aiservhermes.loadbalancer.server.port=12320"

    # aiservlitellm — LiteLLM complexity router (local Gemma + MiniMax).
    # Docs: shared/litellm/README.md
    aiservlitellm:
        build:
            context: ../shared/litellm/
        depends_on:
            infrapgsql:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            - LLM_MASTER_KEY=${AIGATE_API_KEY}
            - DATABASE_URL=postgresql://${DB_ADMIN_USER}:${DB_ADMIN_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${AIGATE_DBNAME}
            - UI_PORT=12380
            - UI_USERNAME=${AIGATE_ADMIN_USER}
            - UI_PASSWORD=${AIGATE_ADMIN_PASSWORD}
            # Edge — local llama.cpp or remote edge service
            - LITEM_EDGE_API_BASE=${AIGATE_HERMES_API_URL:-http://aiservllamacpp:12386/v1}
            - LITEM_EDGE_API_KEY=${AIGATE_HERMES_API_KEY:-none}
            # Health check for auto-failover routing (used by smartrouter.py)
            - LITEM_EDGE_HEALTH_URL=${AIGATE_HERMES_HEALTH_URL:-http://aiservllamacpp:12386/health}
            - LITEM_EDGE_HEALTH_TIMEOUT=3
            - LITEM_EDGE_HEALTH_CACHE_TTL=30
            # Cloud — public or remote cloud provider
            - LITEM_CLOUD_API_BASE=${AIGATE_PROVIDER_API_BASE}
            - LITEM_CLOUD_API_KEY=${AIGATE_PROVIDER_API_KEY}
        healthcheck:
            test: [ "CMD", "curl", "-sf", "-H", "Authorization: Bearer ${AIGATE_API_KEY}", "http://localhost:12380/health/liveliness" ]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        image: aiservlitellm:latest
        networks:
            - subnet
        ports:
            - 12380:12380
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/aiserv/litellm:/opt/litellm   # place config.yaml here to override default

    # aiservllamacpp — llama.cpp Gemma chat inference.
    # Docs: shared/llamacpp/README.md
    aiservllamacpp:
        build:
            context: ../shared/llamacpp/
        cap_add:
            - IPC_LOCK           # required for --mlock to work inside Docker
        environment:
            - TZ=${TIME_ZONE}
            - LLAMA_CACHE=/models
            - LLAMA_MODEL=${LLAMA_CHTMDL}
            - LLAMA_PORT=12386
            - LLAMA_ARGS=${LLAMA_CHTARG}
            - HF_TOKEN=${HF_TOKEN}
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:12386/health" ]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 120s   # 5.6 GB model + mmproj; ~60-90s to mlock into RAM
        image: aiservllamacpp:latest
        networks:
            - subnet
        restart: unless-stopped
        ports:
            - 12386:12386
        ulimits:
            memlock:
                soft: -1
                hard: -1         # unlimited memlock — needed alongside IPC_LOCK
        volumes:
            - ${APPS_DATA}/aiserv/llamacpp:/models

    # aiservowui — Open WebUI AI platform chat interface (moved from webapp per
    # ADR-009; it serves the AI platform, not the business applications).
    # Docs: shared/openwebui/README.md
    aiservowui:
        build:
            context: ../shared/openwebui/
        depends_on:
            routetraefik:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
        image: aiservowui:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.aiservowui.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.aiservowui.rule=Host(`${CHAT_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.aiservowui.service=aiservowui"
            # Define the internal container port for routing
            - "traefik.http.services.aiservowui.loadbalancer.server.port=8080"
            # Enable TLS on this router
            - "traefik.http.routers.aiservowui.tls=true"
            # Rate limit + security headers (defined in shared/traefik/advanced/middlewares-security.yml)
            - "traefik.http.routers.aiservowui.middlewares=secure-chain@file"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.aiservowui.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/aiserv/openwebui:/app/backend/data
