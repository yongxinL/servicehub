services:
    # Stalwart Mail Server - all-in-one mail & collaboration server
    posteservice:
        build:
            context: ../shared/stalwart/
            args:
                - IMAGE_TAG=v0.16
        depends_on:
            routetraefik:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            - MAIL_DOMAIN=${EMAIL_HOST}
            - STALWART_PUBLIC_URL=${EMAIL_HOST}
            - ACME_FILE=/letsencrypt/acme.json
            - ACME_RESOLVER=${CERTRESOLVER}
            - CERT_CHECK_INTERVAL=86400
        healthcheck:
            test: [ "CMD", "curl", "-fsS", "http://localhost:8080/healthz" ]
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 5
        hostname: ${EMAIL_HOST}
        image: posteservice:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.posteservice.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.posteservice.rule=Host(`${EMAIL_HOST}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.posteservice.service=posteservice"
            # Define the internal container port for routing
            - "traefik.http.services.posteservice.loadbalancer.server.port=8080"
            # Restrict the admin UI / JMAP endpoint to trusted IP ranges
            - "traefik.http.routers.posteservice.middlewares=posteservice-whitelist"
            - "traefik.http.middlewares.posteservice-whitelist.ipallowlist.sourcerange=${TRUSTED_IP}"
            # Enable TLS on this router
            - "traefik.http.routers.posteservice.tls=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.posteservice.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        ports:
            - "25:25"       # SMTP server-to-server, STARTTLS
            - "465:465"     # SMTP submission, implicit TLS
            - "587:587"     # SMTP submission, STARTTLS
            - "993:993"     # IMAP, implicit TLS
            # Optional listeners. Enable only if required.
            # - "110:110"
            # - "143:143"     # IMAP, STARTTLS;
            # - "995:995"
            # - "4190:4190"   # ManageSieve;
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/platform/mailbox:/var/lib/stalwart
            - ${APPS_DATA}/certs:/letsencrypt

    # Bulwark Webmail - self-hosted JMAP webmail for Stalwart
    # https://github.com/bulwarkmail/webmail
    postewebmail:
        build:
            context: ../shared/bulwark/
        depends_on:
            posteservice:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            # Branding
            - APP_NAME=Webmail
            - APP_SHORT_NAME=Webmail
            - APP_DESCRIPTION=Self-hosted webmail
            # JMAP endpoint — resolves via Docker DNS because posteservice
            # sets its container hostname to ${EMAIL_HOST}.
            - JMAP_SERVER_URL=https://${EMAIL_HOST}
            # Enable Stalwart-specific features (password change, Sieve UI, etc.)
            - STALWART_FEATURES=true
            # OAuth2 / OIDC (Authentik)
            - OAUTH_ENABLED=${WEBMAIL_OIDC_ENABLED}
            - OAUTH_ONLY=${WEBMAIL_OIDC_ONLY}
            - OAUTH_ISSUER_URL=${WEBMAIL_OIDC_ISSUER}
            - OAUTH_CLIENT_ID=${WEBMAIL_OIDC_CLIENT_ID}
            - OAUTH_CLIENT_SECRET=${WEBMAIL_OIDC_CLIENT_SECRET}
            # Allow IdP discovery to resolve to RFC-1918 addresses (split-DNS)
            - OAUTH_ALLOW_PRIVATE_ENDPOINTS=true
            # Skip the login form and go straight to the IdP when OIDC is on
            - AUTO_SSO_ENABLED=${WEBMAIL_OIDC_ONLY}
            # Session cookie encryption (openssl rand -base64 32)
            - SESSION_SECRET=${WEBMAIL_SESSION_SECRET}
            # Sync per-account settings (encrypted at rest with SESSION_SECRET)
            - SETTINGS_SYNC_ENABLED=true
            # Persistent state dirs
            - SETTINGS_DATA_DIR=/data/settings
            - ADMIN_CONFIG_DIR=/data/admin
            - ADMIN_STATE_DIR=/data/admin-state
            - ADMIN_CONFIG_READONLY=false
            - TELEMETRY_DATA_DIR=/data/telemetry
            - BULWARK_TELEMETRY=off
            # Listen address
            - HOSTNAME=0.0.0.0
            - PORT=3000
        healthcheck:
            test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 5
        image: postewebmail:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entrypoint
            - "traefik.http.routers.postewebmail.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.postewebmail.rule=Host(`${WEBMAIL_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.postewebmail.service=postewebmail"
            # Define the internal container port for routing
            - "traefik.http.services.postewebmail.loadbalancer.server.port=3000"
            # Enable TLS on this router
            - "traefik.http.routers.postewebmail.tls=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.postewebmail.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - ${APPS_DATA}/platform/webmail/settings:/data/settings
            - ${APPS_DATA}/platform/webmail/admin:/data/admin
            - ${APPS_DATA}/platform/webmail/admin-state:/data/admin-state
            - ${APPS_DATA}/platform/webmail/telemetry:/data/telemetry
