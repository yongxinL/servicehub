services:
    # obsvcevm — VictoriaMetrics time-series database. Docs: shared/victoriametrics/README.md
    obsvcevm:
        build:
            context: ../shared/victoriametrics/
        command:
            - "--storageDataPath=/storage"
            - "--httpListenAddr=:8428"
            - "--promscrape.config=/etc/vm/scrape.yaml"
            - "--promscrape.config.strictParse=false"
            - "--enableTCP6=true"
        healthcheck:
            test: [ "CMD-SHELL", "curl -fsS http://localhost:8428/health || exit 1" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 20s
        image: obsvcevm:latest
        networks:
            - subnet
        ports:
            - "8428:8428" # HTTP API - for remote Alloy/metrics push
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/obsvce/victoriametrics:/storage
            - ../shared/victoriametrics/scrape.yaml:/etc/vm/scrape.yaml:ro

    # obsvcevlogs — VictoriaLogs log aggregation. Docs: shared/victorialogs/README.md
    obsvcevlogs:
        build:
            context: ../shared/victorialogs/
        command:
            - "--storageDataPath=/vlogs"
            - "--httpListenAddr=:9428"
        healthcheck:
            test: [ "CMD-SHELL", "curl -fsS http://localhost:9428/health || exit 1" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 20s
        image: obsvcevlogs:latest
        networks:
            - subnet
        ports:
            - "9428:9428" # HTTP API - for remote Alloy/log push
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/obsvce/victorialogs:/vlogs

    # obsvcealloy — Grafana Alloy telemetry collector. Docs: shared/grafana/alloy/README.md
    obsvcealloy:
        build:
            context: ../shared/grafana/alloy/
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:9080
            - /etc/alloy/config.alloy
        depends_on:
            obsvcevlogs:
                condition: service_healthy
            obsvcevm:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "curl -fsS http://localhost:9080/health || exit 1" ]
            interval: 30s
            timeout: 10s
            retries: 5
        hostname: ${DOMAIN_NAME}
        image: obsvcealloy:latest
        networks:
            - subnet
        privileged: true
        restart: unless-stopped
        volumes:
            - ../shared/grafana/geoip/GeoLite2-City.mmdb:/geoip/GeoLite2-City.mmdb:ro # GeoLite2 City database for GeoIP enrichment
            - ../shared/grafana/alloy:/etc/alloy:ro # Alloy config files
            - /var/run/docker.sock:/var/run/docker.sock # Docker API — cAdvisor + Loki log discovery (writable required for cAdvisor)
            - /proc:/host/proc:ro # unix exporter — procfs_path (CPU, memory, network)
            - /sys:/host/sys:ro # unix exporter — sysfs_path (disk I/O, hardware info)
            - /sys/fs/cgroup:/sys/fs/cgroup:ro # cAdvisor — cgroup stats (standard in-container path)

    # obsvcegrafana — Grafana dashboards. Docs: shared/grafana/README.md
    obsvcegrafana:
        build:
            context: ../shared/grafana/
        depends_on:
            routetraefik:
                condition: service_healthy
            obsvcegrafanainit:
                condition: service_completed_successfully
            obsvcealloy:
                condition: service_healthy
        environment:
            - GF_ALERTING_enabled=true
            - GF_ALERTING_render_only_panels=true
            - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
            - GF_SECURITY_ADMIN_PASSWORD=${OBSERVABILITY_ADMIN_PASSWORD}
            - GF_SECURITY_ADMIN_USER=${OBSERVABILITY_ADMIN_USER}
            - GF_SERVER_DOMAIN=${OBSERVABILITY_DOMAIN}
            - GF_SERVER_ROOT_URL=https://${OBSERVABILITY_DOMAIN}
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        image: obsvcegrafana:latest
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.obsvcegrafana.entrypoints=websecure"
            - "traefik.http.routers.obsvcegrafana.rule=Host(`${OBSERVABILITY_DOMAIN}`)"
            - "traefik.http.routers.obsvcegrafana.tls=true"
            - "traefik.http.services.obsvcegrafana.loadbalancer.server.port=3000"
            # uncomment when Domain Level Forward Authentication enabled in Authentik
            - "traefik.http.routers.obsvcegrafana.middlewares=secure-chain@file,authentik-forwardauth@file"
            - "traefik.http.routers.obsvcegrafana.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/obsvce/grafana:/var/lib/grafana
            - ../shared/grafana/provisioning:/etc/grafana/provisioning:ro
            - ../shared/grafana/dashboards:/var/lib/grafana/dashboards/observability:ro

    # obsvcegrafanainit — one-shot: Grafana data dir ownership fix. Docs: shared/grafana/README.md
    obsvcegrafanainit:
        command: >
            sh -c '[ "$(stat -c %u /var/lib/grafana 2>/dev/null)" != "472" ] && chown -R 472:472 /var/lib/grafana || true; chmod -R 775 /var/lib/grafana'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/obsvce/grafana:/var/lib/grafana
