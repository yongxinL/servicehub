services:
    # Gitea data + config permission init
    wbsvcrepoint:
        command: >
            sh -c 'chown -R 1000:1000 /data /config 2>/dev/null; chmod -R 755 /data /config 2>/dev/null || true'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/repbuk/data:/data
            - ${APPS_DATA}/repbuk/config:/config

    # Forgejo: self-hosted software development service
    wbsvcrepobuk:
        build:
            context: ../shared/forgejo/server/
        depends_on:
            routetraefik:
                condition: service_healthy
            dbsvcpgsqldb:
                condition: service_healthy
        environment:
            - USER_UID=1000
            - USER_GID=1000
            # Using MySQL for databases
            - FORGEJO__database__DB_TYPE=postgres
            - FORGEJO__database__HOST=${PGRSQL_HOST}:${PGRSQL_PORT}
            - FORGEJO__database__NAME=${REPBUK_DBNAME}
            - FORGEJO__database__USER=${SQLDB_USER}
            - FORGEJO__database__PASSWD=${SQLDB_PASS}
            # Disable openID authentication and login
            - FORGEJO__openid__ENABLE_OPENID_SIGNIN=false
            - FORGEJO__openid__ENABLE_OPENID_SIGNUP=false
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        image: wbsvcrepobuk:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.wbsvcrepobuk.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.wbsvcrepobuk.rule=Host(`${REPBUK_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.wbsvcrepobuk.service=wbsvcrepobuk"
            # Define the internal container port for routing
            - "traefik.http.services.wbsvcrepobuk.loadbalancer.server.port=3000"
            # Enable TLS on this router
            - "traefik.http.routers.wbsvcrepobuk.tls=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.wbsvcrepobuk.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - ${APPS_DATA}/wbsvcrepobuk/data:/var/lib/gitea

    # Gitea Act Runner - executes CI/CD workflows
    # https://codeberg.org/gitea/act_runner
    wbsvcreporun:
        build:
            context: ../shared/gitea/runner/
        depends_on:
            wbsvcrepobuk:
                condition: service_healthy
        environment:
            - GITEA_INSTANCE_URL=https://${REPBUK_DOMAIN}
            - GITEA_RUNNER_REGISTRATION_TOKEN=${REPBUK_RUNTOKEN}
        image: wbsvcreporun:latest
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            # Mount Docker socket for running docker commands in workflows
            - /var/run/docker.sock:/var/run/docker.sock
            # Runner data persistence
            - ${APPS_DATA}/repbuk/runner:/data

    # Confluence - CMS and blogging platform
    wbsvcwebhome:
        build:
            context: ../shared/confluence/
        depends_on:
            authnservice:
                condition: service_healthy
        environment:
            - ATL_PROXY_NAME=${WEBHOM_DOMAIN}
            - ATL_PROXY_PORT=443
            - JVM_MAXIMUM_MEMORY=3072m
            - JVM_MINIMUM_MEMORY=1024m
            - ATL_TOMCAT_PORT=8090
            - ATL_TOMCAT_SCHEME=https
            - ATL_TOMCAT_MAXTHREADS=48
            - ATL_TOMCAT_MINSPARETHREAD=6
            - ATL_TOMCAT_MAXHTTPHEADERSIZE=8192
            - ATL_DB_POOLMAXSIZE=125
            - ATL_DB_TYPE=postgresql
            - ATL_JDBC_URL=jdbc:postgresql://${PGRSQL_HOST}:${PGRSQL_PORT}/${WEBHOM_DBNAME}
            - ATL_JDBC_USER=${SQLDB_USER}
            - ATL_JDBC_PASSWORD=${SQLDB_PASS}
            - JVM_SUPPORT_RECOMMENDED_ARGS=-Dmail.smtp.ssl.protocols=TLSv1.2 -Dupm.pac.disable=true --Datlassian.upm.signature.check.disabled=true
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8090/status"]
            start_period: 60s
            interval: 30s
            retries: 5
            timeout: 5s
        image: wbsvcwebhome:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.wbsvcwebhome.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.wbsvcwebhome.rule=Host(`${WEBHOM_DOMAIN}`) || Host(`${DOMAIN_NAME}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.wbsvcwebhome.service=wbsvcwebhome"
            # Define the internal container port for routing
            - "traefik.http.services.wbsvcwebhome.loadbalancer.server.port=8090"
            # Enable TLS on this router
            - "traefik.http.routers.wbsvcwebhome.tls=true"
            # Apply a compression middleware
            - "traefik.http.routers.wbsvcwebhome.middlewares=confserv-compress"
            # Define settings for the compression middleware
            - "traefik.http.middlewares.confserv-compress.compress=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.wbsvcwebhome.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/wbsvcwebhome:/var/atlassian/application-data/confluence
