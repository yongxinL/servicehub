services:
    # devopsforgejoinit — one-shot: create Forgejo and runner data dirs, chown 1000:1000. Docs: shared/forgejo/README.md
    devopsforgejoinit:
        command: >
            sh -c 'mkdir -p /data /var/lib/forgejo-runner &&
                   chown -R 1000:1000 /data /var/lib/forgejo-runner'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/devops/forgejo/data:/data
            - ${APPS_DATA}/devops/forgejo/runner:/var/lib/forgejo-runner

    # devopsforgejo — Forgejo git server + Actions (HTTPS clone via Traefik; SSH not published — use HTTPS clones). Docs: shared/forgejo/README.md
    devopsforgejo:
        build:
            context: ../shared/forgejo/server/
            args:
                - IMAGE_TAG=${SOURCECODE_TAG}
        depends_on:
            infrapgsql:
                condition: service_healthy
            infraauth:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            - USER_UID=1000
            - USER_GID=1000
            - FORGEJO__server__DOMAIN=${SOURCECODE_DOMAIN}
            - FORGEJO__server__ROOT_URL=https://${SOURCECODE_DOMAIN}/
            # SSH port is not published; advertise HTTPS clone URLs only
            - FORGEJO__server__DISABLE_SSH=true
            - FORGEJO__database__DB_TYPE=postgres
            - FORGEJO__database__HOST=${POSTGRES_HOST}:${POSTGRES_PORT}
            - FORGEJO__database__NAME=${SOURCECODE_DBNAME}
            - FORGEJO__database__USER=${DB_ADMIN_USER}
            - FORGEJO__database__PASSWD=${DB_ADMIN_PASSWORD}
            - FORGEJO__openid__ENABLE_OPENID_SIGNIN=false
            - FORGEJO__openid__ENABLE_OPENID_SIGNUP=false
            - FORGEJO__actions__ENABLED=true
            # Security: only admins create accounts; sign-in should be delegated
            # to Authentik (OIDC) so MFA applies — see shared/forgejo/README.md
            - FORGEJO__service__DISABLE_REGISTRATION=true
        healthcheck:
            test: [ "CMD", "curl", "-fsS", "http://localhost:3000/api/healthz" ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        image: devopsforgejo:latest
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.devopsforgejo.entrypoints=websecure"
            - "traefik.http.routers.devopsforgejo.rule=Host(`${SOURCECODE_DOMAIN}`)"
            - "traefik.http.routers.devopsforgejo.service=devopsforgejo"
            - "traefik.http.services.devopsforgejo.loadbalancer.server.port=3000"
            - "traefik.http.routers.devopsforgejo.tls=true"
            # Rate limit + security headers (defined in shared/traefik/advanced/middlewares-security.yml)
            - "traefik.http.routers.devopsforgejo.middlewares=secure-chain@file"
            - "traefik.http.routers.devopsforgejo.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/devops/forgejo/data:/data

    # devopsrunner — Forgejo Actions runner using host-mode execution.
    # Workflow jobs run inside this runner container and deploy to Docker hosts
    # over SSH. No temporary job container or Docker socket is required.
    # Docs: shared/forgejo/README.md
    devopsrunner:
        build:
            context: ../shared/forgejo/actions/
            args:
                - IMAGE_TAG=${SOURCECODE_RUNNER_TAG}
        depends_on:
            devopsforgejoinit:
                condition: service_completed_successfully
            devopsforgejo:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            - SOURCECODE_RUNNER_SECRET=${SOURCECODE_RUNNER_SECRET}
            - FORGEJO_INSTANCE_URL=http://devopsforgejo:3000
            - FORGEJO_RUNNER_NAME=devopsrunner
        # The runner daemon has no HTTP endpoint; the healthcheck verifies the
        # daemon process is alive and the registration file is non-empty.
        # `pidof` is provided by Alpine's busybox and is always available.
        healthcheck:
            test: ["CMD-SHELL", "pidof forgejo-runner > /dev/null && [ -s /var/lib/forgejo-runner/.runner ]"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        image: devopsrunner:latest
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            # Version-controlled runtime configuration.
            - ../shared/forgejo/actions/config.yml:/etc/forgejo-runner/config.yml:ro
            # Persistent registration identity and runner data.
            - ${APPS_DATA}/devops/forgejo/runner:/var/lib/forgejo-runner
            # Host-mode job workspace.
            - ${APPS_DATA}/devops/forgejo/workspace:/workspace
