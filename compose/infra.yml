services:
    # inframariadb — MariaDB 11.8 (MySQL-compatible). Docs: docs/products/mariadb.md
    inframariadb:
        build:
            context: ../shared/mariadb/
        environment:
            - MARIADB_USER=${DB_ADMIN_USER}
            - MARIADB_PASSWORD=${DB_ADMIN_PASSWORD}
            - MARIADB_ROOT_PASSWORD=${DB_ADMIN_PASSWORD}
            - MARIADB_DATABASES=${MARIADB_DATABASES}
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            start_period: 10s
            interval: 10s
            timeout: 5s
            retries: 3
        image: inframariadb:latest
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/infra/mariadb:/var/lib/mysql

    # infrapgsql — PostgreSQL 16. Docs: docs/products/postgresql.md
    infrapgsql:
        build:
            context: ../shared/postgresql/
        environment:
            - POSTGRES_USER=${DB_ADMIN_USER}
            - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD}
            - POSTGRES_DB_LIST=${POSTGRES_DATABASES:-defaultdb}
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB_LIST%%,*} -U $${POSTGRES_USER}" ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        image: infrapgsql:latest
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 128mb
        volumes:
            - ${APPS_DATA}/infra/postgresql:/var/lib/postgresql/data

    # infraauthinit — one-shot: Authentik data dir ownership fix. Docs: docs/products/authentik.md
    infraauthinit:
        command: >
            sh -c 'chown -R 1000:1000 /data /templates 2>/dev/null; chmod -R 755 /data /templates 2>/dev/null || true'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/infra/authentik/media:/data
            - ${APPS_DATA}/infra/authentik/templates:/templates

    # infraauth — Authentik server (UI/API). Docs: docs/products/authentik.md
    # First boot: https://${IDENTITY_DOMAIN}/if/flow/initial-setup/
    infraauth:
        build:
            context: ../shared/authentik/
            args:
                - IMAGE_TAG=${IDENTITY_TAG}
        command: server
        depends_on:
            routetraefik:
                condition: service_healthy
            infraauthwrk:
                condition: service_started
        environment:
            # authentick settings
            - PG_PASS=${IDENTITY_PASSWORD}
            - AUTHENTIK_SECRET_KEY=${IDENTITY_SECRET}
            # disable outbound analytics connections
            - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
            - AUTHENTIK_DISABLE_UPDATE_CHECK=true
            - AUTHENTIK_ERROR_REPORTING__ENABLED=false
            # authentik email settings
            - AUTHENTIK_EMAIL__HOST=${EMAIL_HOST}
            - AUTHENTIK_EMAIL__PORT=${EMAIL_PORT}
            - AUTHENTIK_EMAIL__USERNAME=${EMAIL_USER}
            - AUTHENTIK_EMAIL__PASSWORD=${EMAIL_PASS}
            - AUTHENTIK_EMAIL__USE_TLS=true
            - AUTHENTIK_EMAIL__FROM=${EMAIL_FROM}
            # PostgreSQL settings
            - AUTHENTIK_POSTGRESQL__HOST=${POSTGRES_HOST}
            - AUTHENTIK_POSTGRESQL__USER=${DB_ADMIN_USER}
            - AUTHENTIK_POSTGRESQL__PASSWORD=${DB_ADMIN_PASSWORD}
            - AUTHENTIK_POSTGRESQL__NAME=${IDENTITY_DBNAME}
            # listen settings
            - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${TRUSTED_IP}
        image: infraauth:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.infraauth.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.infraauth.rule=Host(`${IDENTITY_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.infraauth.service=infraauth"
            # Define the internal container port for routing
            - "traefik.http.services.infraauth.loadbalancer.server.port=9000"
            # Enable TLS on this router
            - "traefik.http.routers.infraauth.tls=true"
            # Rate limit + security headers (defined in shared/traefik/advanced/middlewares-security.yml)
            - "traefik.http.routers.infraauth.middlewares=secure-chain@file"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.infraauth.tls.certresolver=${CERTRESOLVER}"
            # Static assets bypass rate-limit: a cold Authentik admin page fetches
            # dozens of chunks within a second and exhausts rate-limit's burst of
            # 50 (429s, the SPA never finishes loading). secure-headers only;
            # priority 200 beats the catch-all infraauth router (docs/operations/
            # TROUBLESHOOTING.md, docs/products/traefik.md#security-middlewares).
            - "traefik.http.routers.infraauth-static.rule=Host(`${IDENTITY_DOMAIN}`) && PathPrefix(`/static`)"
            - "traefik.http.routers.infraauth-static.entrypoints=websecure"
            - "traefik.http.routers.infraauth-static.service=infraauth"
            - "traefik.http.routers.infraauth-static.priority=200"
            - "traefik.http.routers.infraauth-static.tls=true"
            - "traefik.http.routers.infraauth-static.tls.certresolver=${CERTRESOLVER}"
            - "traefik.http.routers.infraauth-static.middlewares=secure-headers@file"
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 512mb
        volumes:
            - ${APPS_DATA}/infra/authentik/media:/data
            - ${APPS_DATA}/infra/authentik/templates:/templates

    # infraauthwrk — Authentik background worker. Docs: docs/products/authentik.md
    infraauthwrk:
        command: worker
        depends_on:
            infraauthinit:
                condition: service_completed_successfully
            infrapgsql:
                condition: service_healthy
        environment:
            # authentick settings
            - PG_PASS=${IDENTITY_PASSWORD}
            - AUTHENTIK_SECRET_KEY=${IDENTITY_SECRET}
            # disable outbound analytics connections
            - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
            - AUTHENTIK_DISABLE_UPDATE_CHECK=true
            - AUTHENTIK_ERROR_REPORTING__ENABLED=false
            # authentik email settings
            - AUTHENTIK_EMAIL__HOST=${EMAIL_HOST}
            - AUTHENTIK_EMAIL__PORT=${EMAIL_PORT}
            - AUTHENTIK_EMAIL__USERNAME=${EMAIL_USER}
            - AUTHENTIK_EMAIL__PASSWORD=${EMAIL_PASS}
            - AUTHENTIK_EMAIL__USE_TLS=true
            - AUTHENTIK_EMAIL__FROM=${EMAIL_FROM}
            # PostgreSQL settings
            - AUTHENTIK_POSTGRESQL__HOST=${POSTGRES_HOST}
            - AUTHENTIK_POSTGRESQL__USER=${DB_ADMIN_USER}
            - AUTHENTIK_POSTGRESQL__PASSWORD=${DB_ADMIN_PASSWORD}
            - AUTHENTIK_POSTGRESQL__NAME=${IDENTITY_DBNAME}
            # listen settings
            - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${TRUSTED_IP}
        image: infraauth:latest
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 512mb
        user: root
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ${APPS_DATA}/infra/authentik/media:/data
            - ${APPS_DATA}/infra/authentik/templates:/templates
