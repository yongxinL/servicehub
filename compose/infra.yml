services:
    # inframariadb — MariaDB 11.8 (MySQL-compatible). Docs: shared/mariadb/README.md
    inframariadb:
        build:
            context: ../shared/mariadb/
        environment:
            - MARIADB_USER=${SQLDB_USER}
            - MARIADB_PASSWORD=${SQLDB_PASS}
            - MARIADB_ROOT_PASSWORD=${SQLDB_PASS}
            - MARIADB_DB_LIST=${MARIADB_DB_LIST}
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            start_period: 10s
            interval: 10s
            timeout: 5s
            retries: 3
        image: inframariadb:latest
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/databases/mariadb:/var/lib/mysql

    # infrapgsql — PostgreSQL 16. Docs: shared/postgresql/README.md
    infrapgsql:
        build:
            context: ../shared/postgresql/
        environment:
            - POSTGRES_USER=${SQLDB_USER}
            - POSTGRES_PASSWORD=${SQLDB_PASS}
            - POSTGRES_DB_LIST=${PGRSQL_DBLIST:-defaultdb}
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB_LIST%%,*} -U $${POSTGRES_USER}" ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        image: infrapgsql:latest
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 128mb
        volumes:
            - ${APPS_DATA}/databases/pgsqldb:/var/lib/postgresql/data

    # infraauthinit — one-shot: Authentik data dir ownership fix. Docs: shared/authentik/README.md
    infraauthinit:
        command: >
            sh -c 'chown -R 1000:1000 /data /templates 2>/dev/null; chmod -R 755 /data /templates 2>/dev/null || true'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/platform/authentik/media:/data
            - ${APPS_DATA}/platform/authentik/templates:/templates

    # infraauth — Authentik server (UI/API). Docs: shared/authentik/README.md
    # First boot: https://${AUTHN_DOMAIN}/if/flow/initial-setup/
    infraauth:
        build:
            context: ../shared/authentik/
            args:
                - IMAGE_TAG=${AUTHN_TAG}
        command: server
        depends_on:
            routetraefik:
                condition: service_healthy
            infraauthwrk:
                condition: service_started
        environment:
            # authentick settings
            - PG_PASS=${AUTHN_PASSWD}
            - AUTHENTIK_SECRET_KEY=${AUTHN_SECRET}
            # disable outbound analytics connections
            - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
            - AUTHENTIK_DISABLE_UPDATE_CHECK=true
            - AUTHENTIK_ERROR_REPORTING__ENABLED=false
            # authentik email settings
            - AUTHENTIK_EMAIL__HOST=${EMAIL_HOST}
            - AUTHENTIK_EMAIL__PORT=${EMAIL_PORT}
            - AUTHENTIK_EMAIL__USERNAME=${EMAIL_USER}
            - AUTHENTIK_EMAIL__PASSWORD=${EMAIL_PASS}
            - AUTHENTIK_EMAIL__USE_TLS=true
            - AUTHENTIK_EMAIL__FROM=${EMAIL_FROM}
            # PostgreSQL settings
            - AUTHENTIK_POSTGRESQL__HOST=${PGRSQL_HOST}
            - AUTHENTIK_POSTGRESQL__USER=${SQLDB_USER}
            - AUTHENTIK_POSTGRESQL__PASSWORD=${SQLDB_PASS}
            - AUTHENTIK_POSTGRESQL__NAME=${AUTHN_DBNAME}
            # listen settings
            - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${TRUSTED_IP}
        image: infraauth:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.infraauth.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.infraauth.rule=Host(`${AUTHN_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.infraauth.service=infraauth"
            # Define the internal container port for routing
            - "traefik.http.services.infraauth.loadbalancer.server.port=9000"
            # Enable TLS on this router
            - "traefik.http.routers.infraauth.tls=true"
            # Rate limit + security headers (defined in shared/traefik/advanced/middlewares-security.yml)
            - "traefik.http.routers.infraauth.middlewares=secure-chain@file"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.infraauth.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 512mb
        volumes:
            - ${APPS_DATA}/platform/authentik/media:/data
            - ${APPS_DATA}/platform/authentik/templates:/templates

    # infraauthwrk — Authentik background worker. Docs: shared/authentik/README.md
    infraauthwrk:
        command: worker
        depends_on:
            infraauthinit:
                condition: service_completed_successfully
            infrapgsql:
                condition: service_healthy
        environment:
            # authentick settings
            - PG_PASS=${AUTHN_PASSWD}
            - AUTHENTIK_SECRET_KEY=${AUTHN_SECRET}
            # disable outbound analytics connections
            - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
            - AUTHENTIK_DISABLE_UPDATE_CHECK=true
            - AUTHENTIK_ERROR_REPORTING__ENABLED=false
            # authentik email settings
            - AUTHENTIK_EMAIL__HOST=${EMAIL_HOST}
            - AUTHENTIK_EMAIL__PORT=${EMAIL_PORT}
            - AUTHENTIK_EMAIL__USERNAME=${EMAIL_USER}
            - AUTHENTIK_EMAIL__PASSWORD=${EMAIL_PASS}
            - AUTHENTIK_EMAIL__USE_TLS=true
            - AUTHENTIK_EMAIL__FROM=${EMAIL_FROM}
            # PostgreSQL settings
            - AUTHENTIK_POSTGRESQL__HOST=${PGRSQL_HOST}
            - AUTHENTIK_POSTGRESQL__USER=${SQLDB_USER}
            - AUTHENTIK_POSTGRESQL__PASSWORD=${SQLDB_PASS}
            - AUTHENTIK_POSTGRESQL__NAME=${AUTHN_DBNAME}
            # listen settings
            - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${TRUSTED_IP}
        image: infraauth:latest
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 512mb
        user: root
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ${APPS_DATA}/platform/authentik/media:/data
            - ${APPS_DATA}/platform/authentik/templates:/templates
