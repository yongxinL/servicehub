services:
    # Stalwart Mail Server - all-in-one mail & collaboration server
    mailsvstalwart:
        build:
            context: ../shared/stalwart/
            args:
                - IMAGE_TAG=v0.16
        depends_on:
            routetraefik:
                condition: service_healthy
            infrapgsql:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            - MAIL_DOMAIN=${EMAIL_HOST}
            - STALWART_PUBLIC_URL=https://${EMAIL_HOST}
            - ACME_FILE=/letsencrypt/acme.json
            - ACME_RESOLVER=${CERTRESOLVER}
            - CERT_CHECK_INTERVAL=86400
            # PostgreSQL data store (infrapgsql); rendered into the Stalwart
            # bootstrap config by the entrypoint at every start
            - STALWART_DB_HOST=${PGRSQL_HOST}
            - STALWART_DB_PORT=${PGRSQL_PORT}
            - STALWART_DB_NAME=${POSTE_DBNAME}
            - STALWART_DB_USER=${SQLDB_USER}
            - STALWART_DB_PASSWORD=${SQLDB_PASS}
            # Fallback admin, mapped to Stalwart's STALWART_RECOVERY_ADMIN so
            # https://${EMAIL_HOST}/admin stays reachable even if the directory
            # (Authentik LDAP) is down. Empty pass disables it.
            - STALWART_ADMIN_USER=${STALWART_ADMIN_USER}
            - STALWART_ADMIN_PASS=${STALWART_ADMIN_PASS}
        healthcheck:
            test: [ "CMD", "curl", "-fsS", "-H", "X-Forwarded-For: 127.0.0.1", "http://localhost:8080/healthz/live" ]
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 5
        hostname: ${EMAIL_HOST}
        image: mailsvstalwart:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Public JMAP endpoints required by Bulwark
            - "traefik.http.routers.mailsvstalwart-jmap.entrypoints=websecure"
            - "traefik.http.routers.mailsvstalwart-jmap.rule=Host(`${EMAIL_HOST}`) && (PathPrefix(`/jmap`) || PathPrefix(`/.well-known/jmap`))"
            - "traefik.http.routers.mailsvstalwart-jmap.service=mailsvstalwart"
            - "traefik.http.routers.mailsvstalwart-jmap.middlewares=secure-chain@file"
            - "traefik.http.routers.mailsvstalwart-jmap.priority=20"
            - "traefik.http.routers.mailsvstalwart-jmap.tls=true"
            - "traefik.http.routers.mailsvstalwart-jmap.tls.certresolver=${CERTRESOLVER}"
            # All other Stalwart paths, including the admin UI/API, remain restricted
            - "traefik.http.routers.mailsvstalwart-admin.entrypoints=websecure"
            - "traefik.http.routers.mailsvstalwart-admin.rule=Host(`${EMAIL_HOST}`) && !(PathPrefix(`/jmap`) || PathPrefix(`/.well-known/jmap`))"
            - "traefik.http.routers.mailsvstalwart-admin.service=mailsvstalwart"
            - "traefik.http.routers.mailsvstalwart-admin.middlewares=secure-chain@file,mailsvstalwart-whitelist"
            - "traefik.http.routers.mailsvstalwart-admin.tls=true"
            - "traefik.http.routers.mailsvstalwart-admin.tls.certresolver=${CERTRESOLVER}"
            # Define the internal container port for routing
            - "traefik.http.services.mailsvstalwart.loadbalancer.server.port=8080"
            # Restrict non-JMAP traffic to trusted IP ranges
            - "traefik.http.middlewares.mailsvstalwart-whitelist.ipallowlist.sourcerange=${TRUSTED_IP}"
        networks:
            - subnet
        ports:
            - "25:25"       # SMTP server-to-server, STARTTLS
            - "465:465"     # SMTP submission, implicit TLS
            - "587:587"     # SMTP submission, STARTTLS
            - "993:993"     # IMAP, implicit TLS
            # Optional listeners. Enable only if required.
            # - "110:110"
            # - "143:143"     # IMAP, STARTTLS;
            # - "995:995"
            # - "4190:4190"   # ManageSieve;
            # - "8080:8080"   # Web management
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/platform/mailbox:/var/lib/stalwart
            - ${APPS_DATA}/certs:/letsencrypt

    # mailsvbulwarkinit — one-shot: create webmail data dirs, chown 1001:1001 (nextjs:nodejs). Docs: shared/bulwark/README.md
    mailsvbulwarkinit:
        command: >
            sh -c 'mkdir -p /data/settings /data/admin /data/admin-state /data/telemetry &&
                   chown -R 1001:1001 /data'
        image: busybox:latest
        networks:
            - subnet
        volumes:
            - ${APPS_DATA}/platform/webmail/settings:/data/settings
            - ${APPS_DATA}/platform/webmail/admin:/data/admin
            - ${APPS_DATA}/platform/webmail/admin-state:/data/admin-state
            - ${APPS_DATA}/platform/webmail/telemetry:/data/telemetry

    # Bulwark Webmail - self-hosted JMAP webmail for Stalwart
    # https://github.com/bulwarkmail/webmail
    mailsvbulwark:
        build:
            context: ../shared/bulwark/
        depends_on:
            mailsvbulwarkinit:
                condition: service_completed_successfully
            mailsvstalwart:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            # Branding
            - APP_NAME=Webmail
            - APP_SHORT_NAME=Webmail
            - APP_DESCRIPTION=Self-hosted webmail
            # JMAP endpoint — resolves via Docker DNS because mailsvstalwart
            # sets its container hostname to ${EMAIL_HOST}.
            - JMAP_SERVER_URL=https://${EMAIL_HOST}
            # Enable Stalwart-specific features (password change, Sieve UI, etc.)
            - STALWART_FEATURES=true
            # Authentication: password form validated by Stalwart over JMAP.
            # No OIDC/SSO: it requires an OIDC-backed Stalwart directory, this
            # stack uses LDAP (docs: shared/bulwark/README.md).
            # Session cookie encryption (openssl rand -base64 32)
            - SESSION_SECRET=${WEBMAIL_SESSION_SECRET}
            # Sync per-account settings (encrypted at rest with SESSION_SECRET)
            - SETTINGS_SYNC_ENABLED=true
            # Persistent state dirs
            - SETTINGS_DATA_DIR=/data/settings
            - ADMIN_CONFIG_DIR=/data/admin
            - ADMIN_STATE_DIR=/data/admin-state
            - ADMIN_CONFIG_READONLY=false
            - TELEMETRY_DATA_DIR=/data/telemetry
            - BULWARK_TELEMETRY=off
            # Listen address
            - HOSTNAME=0.0.0.0
            - PORT=3000
        healthcheck:
            test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 5
        image: mailsvbulwark:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entrypoint
            - "traefik.http.routers.mailsvbulwark.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.mailsvbulwark.rule=Host(`${WEBMAIL_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.mailsvbulwark.service=mailsvbulwark"
            # Define the internal container port for routing
            - "traefik.http.services.mailsvbulwark.loadbalancer.server.port=3000"
            # Enable TLS on this router
            - "traefik.http.routers.mailsvbulwark.tls=true"
            # Rate limit + security headers (defined in shared/traefik/advanced/middlewares-security.yml)
            - "traefik.http.routers.mailsvbulwark.middlewares=secure-chain@file"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.mailsvbulwark.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - ${APPS_DATA}/platform/webmail/settings:/data/settings
            - ${APPS_DATA}/platform/webmail/admin:/data/admin
            - ${APPS_DATA}/platform/webmail/admin-state:/data/admin-state
            - ${APPS_DATA}/platform/webmail/telemetry:/data/telemetry
