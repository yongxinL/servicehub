services:
    # authnsvrinit — one-shot: Authentik data dir ownership fix. Docs: shared/authentik/README.md
    authnsvrinit:
        command: >
            sh -c 'chown -R 1000:1000 /data /templates 2>/dev/null; chmod -R 755 /data /templates 2>/dev/null || true'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/webapps/authentik/media:/data
            - ${APPS_DATA}/webapps/authentik/templates:/templates

    # authnservice — Authentik server (UI/API). Docs: shared/authentik/README.md
    # First boot: https://${AUTHN_DOMAIN}/if/flow/initial-setup/
    authnservice:
        build:
            context: ../shared/authentik/
            args:
                - IMAGE_TAG=${AUTHN_TAG}
        command: server
        depends_on:
            routetraefik:
                condition: service_healthy
            authnworkers:
                condition: service_started
        environment:
            # authentick settings
            - PG_PASS=${AUTHN_PASSWD}
            - AUTHENTIK_SECRET_KEY=${AUTHN_SECRET}
            # disable outbound analytics connections
            - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
            - AUTHENTIK_DISABLE_UPDATE_CHECK=true
            - AUTHENTIK_ERROR_REPORTING__ENABLED=false
            # authentik email settings
            - AUTHENTIK_EMAIL__HOST=${EMAIL_HOST}
            - AUTHENTIK_EMAIL__PORT=${EMAIL_PORT}
            - AUTHENTIK_EMAIL__USERNAME=${EMAIL_USER}
            - AUTHENTIK_EMAIL__PASSWORD=${EMAIL_PASS}
            - AUTHENTIK_EMAIL__USE_TLS=true
            - AUTHENTIK_EMAIL__FROM=${EMAIL_FROM}
            # PostgreSQL settings
            - AUTHENTIK_POSTGRESQL__HOST=${PGRSQL_HOST}
            - AUTHENTIK_POSTGRESQL__USER=${SQLDB_USER}
            - AUTHENTIK_POSTGRESQL__PASSWORD=${SQLDB_PASS}
            - AUTHENTIK_POSTGRESQL__NAME=${AUTHN_DBNAME}
            # listen settings
            - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${TRUSTED_IP}
        image: authnservice:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.authnservice.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.authnservice.rule=Host(`${AUTHN_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.authnservice.service=authnservice"
            # Define the internal container port for routing
            - "traefik.http.services.authnservice.loadbalancer.server.port=9000"
            # Enable TLS on this router
            - "traefik.http.routers.authnservice.tls=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.authnservice.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 512mb
        volumes:
            - ${APPS_DATA}/webapps/authentik/media:/data
            - ${APPS_DATA}/webapps/authentik/templates:/templates

    # authnworkers — Authentik background worker. Docs: shared/authentik/README.md
    authnworkers:
        command: worker
        depends_on:
            authnsvrinit:
                condition: service_completed_successfully
            dbsvcpgsqldb:
                condition: service_healthy
        environment:
            # authentick settings
            - PG_PASS=${AUTHN_PASSWD}
            - AUTHENTIK_SECRET_KEY=${AUTHN_SECRET}
            # disable outbound analytics connections
            - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
            - AUTHENTIK_DISABLE_UPDATE_CHECK=true
            - AUTHENTIK_ERROR_REPORTING__ENABLED=false
            # authentik email settings
            - AUTHENTIK_EMAIL__HOST=${EMAIL_HOST}
            - AUTHENTIK_EMAIL__PORT=${EMAIL_PORT}
            - AUTHENTIK_EMAIL__USERNAME=${EMAIL_USER}
            - AUTHENTIK_EMAIL__PASSWORD=${EMAIL_PASS}
            - AUTHENTIK_EMAIL__USE_TLS=true
            - AUTHENTIK_EMAIL__FROM=${EMAIL_FROM}
            # PostgreSQL settings
            - AUTHENTIK_POSTGRESQL__HOST=${PGRSQL_HOST}
            - AUTHENTIK_POSTGRESQL__USER=${SQLDB_USER}
            - AUTHENTIK_POSTGRESQL__PASSWORD=${SQLDB_PASS}
            - AUTHENTIK_POSTGRESQL__NAME=${AUTHN_DBNAME}
            # listen settings
            - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${TRUSTED_IP}
        image: authnservice:latest
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 512mb
        user: root
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ${APPS_DATA}/webapps/authentik/media:/data
            - ${APPS_DATA}/webapps/authentik/templates:/templates
