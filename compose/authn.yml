services:
    # =========================================================================
    # authnsvrinit — authentik media/template permission one-shot
    #
    # Runs to completion before the authentik worker and normalises ownership of
    # the bind-mounted data and config directories so the rootless (UID/GID
    # 1000) authentik container can write to them.
    #
    #   Depends on : none (must complete before authnservice / authnworkers)
    # =========================================================================
    authnsvrinit:
        command: >
            sh -c 'chown -R 1000:1000 /data /templates 2>/dev/null; chmod -R 755 /data /templates 2>/dev/null || true'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/webapps/authentik/media:/data
            - ${APPS_DATA}/webapps/authentik/templates:/templates

    # =========================================================================
    # authnservice — Authentik identity provider / SSO server
    #
    # Open-source IdP providing SSO and forward authentication for the stack
    # (e.g. the Traefik dashboard and Grafana). First boot: open
    # https://${AUTHN_DOMAIN}/if/flow/initial-setup/ to create the admin user.
    #
    #   URL        : https://${AUTHN_DOMAIN}
    #   Port       : 9000 (internal, published through Traefik)
    #   Database   : PostgreSQL (${AUTHN_DBNAME})
    #   Data       : ${APPS_DATA}/webapps/authentik/{media,templates}
    #   Depends on : routetraefik (healthy), dbsvcpgsqldb (started)
    #
    # Forward-auth integration: https://github.com/brokenscripts/authentik_traefik
    # =========================================================================
    authnservice:
        build:
            context: ../shared/authentik/
            args:
                - IMAGE_TAG=${AUTHN_TAG}
        command: server
        depends_on:
            routetraefik:
                condition: service_healthy
            authnworkers:
                condition: service_started
        environment:
            # authentick settings
            - PG_PASS=${AUTHN_PASSWD}
            - AUTHENTIK_SECRET_KEY=${AUTHN_SECRET}
            # disable outbound analytics connections
            - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
            - AUTHENTIK_DISABLE_UPDATE_CHECK=true
            - AUTHENTIK_ERROR_REPORTING__ENABLED=false
            # authentik email settings
            - AUTHENTIK_EMAIL__HOST=${SMTP_HOST}
            - AUTHENTIK_EMAIL__PORT=${SMTP_PORT}
            - AUTHENTIK_EMAIL__USERNAME=${SMTP_USER}
            - AUTHENTIK_EMAIL__PASSWORD=${SMTP_PASS}
            - AUTHENTIK_EMAIL__USE_TLS=true
            - AUTHENTIK_EMAIL__FROM=${SMTP_FROM}
            # PostgreSQL settings
            - AUTHENTIK_POSTGRESQL__HOST=${PGRSQL_HOST}
            - AUTHENTIK_POSTGRESQL__USER=${SQLDB_USER}
            - AUTHENTIK_POSTGRESQL__PASSWORD=${SQLDB_PASS}
            - AUTHENTIK_POSTGRESQL__NAME=${AUTHN_DBNAME}
            # listen settings
            - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${TRUSTED_IP}
        image: authnservice:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.authnservice.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.authnservice.rule=Host(`${AUTHN_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.authnservice.service=authnservice"
            # Define the internal container port for routing
            - "traefik.http.services.authnservice.loadbalancer.server.port=9000"
            # Enable TLS on this router
            - "traefik.http.routers.authnservice.tls=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.authnservice.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 512mb
        volumes:
            - ${APPS_DATA}/webapps/authentik/media:/data
            - ${APPS_DATA}/webapps/authentik/templates:/templates

    # =========================================================================
    # authnworkers — Authentik background worker
    #
    # Processes flows, policies, outpost sync and notifications on behalf of
    # authnservice. Shares the server image but runs the `worker` command.
    #
    #   Data       : ${APPS_DATA}/webapps/authentik/{media,templates}
    #   Depends on : dbsvcpgsqldb (healthy)
    # =========================================================================
    authnworkers:
        command: worker
        depends_on:
            authnsvrinit:
                condition: service_completed_successfully
            dbsvcpgsqldb:
                condition: service_healthy
        environment:
            # authentick settings
            - PG_PASS=${AUTHN_PASSWD}
            - AUTHENTIK_SECRET_KEY=${AUTHN_SECRET}
            # disable outbound analytics connections
            - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
            - AUTHENTIK_DISABLE_UPDATE_CHECK=true
            - AUTHENTIK_ERROR_REPORTING__ENABLED=false
            # authentik email settings
            - AUTHENTIK_EMAIL__HOST=${SMTP_HOST}
            - AUTHENTIK_EMAIL__PORT=${SMTP_PORT}
            - AUTHENTIK_EMAIL__USERNAME=${SMTP_USER}
            - AUTHENTIK_EMAIL__PASSWORD=${SMTP_PASS}
            - AUTHENTIK_EMAIL__USE_TLS=true
            - AUTHENTIK_EMAIL__FROM=${SMTP_FROM}
            # PostgreSQL settings
            - AUTHENTIK_POSTGRESQL__HOST=${PGRSQL_HOST}
            - AUTHENTIK_POSTGRESQL__USER=${SQLDB_USER}
            - AUTHENTIK_POSTGRESQL__PASSWORD=${SQLDB_PASS}
            - AUTHENTIK_POSTGRESQL__NAME=${AUTHN_DBNAME}
            # listen settings
            - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=${TRUSTED_IP}
        image: authnservice:latest
        networks:
            - subnet
        restart: unless-stopped
        shm_size: 512mb
        user: root
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ${APPS_DATA}/webapps/authentik/media:/data
            - ${APPS_DATA}/webapps/authentik/templates:/templates
