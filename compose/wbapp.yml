services:
    # wbappcmshome — Confluence homepage / CMS. Docs: shared/confluence/README.md
    wbappcmshome:
        build:
            context: ../shared/confluence/
            args:
                - IMAGE_TAG=${WBHOME_TAG}
        depends_on:
            authnservice:
                condition: service_healthy
        environment:
            - ATL_PROXY_NAME=${WBHOME_DOMAIN}
            - ATL_PROXY_PORT=443
            - JVM_MAXIMUM_MEMORY=3072m
            - JVM_MINIMUM_MEMORY=1024m
            - ATL_TOMCAT_PORT=8090
            - ATL_TOMCAT_SCHEME=https
            - ATL_TOMCAT_MAXTHREADS=48
            - ATL_TOMCAT_MINSPARETHREAD=6
            - ATL_TOMCAT_MAXHTTPHEADERSIZE=8192
            - ATL_DB_POOLMAXSIZE=125
            - ATL_DB_TYPE=postgresql
            - ATL_JDBC_URL=jdbc:postgresql://${PGRSQL_HOST}:${PGRSQL_PORT}/${WBHOME_DBNAME}
            - ATL_JDBC_USER=${SQLDB_USER}
            - ATL_JDBC_PASSWORD=${SQLDB_PASS}
            - JVM_SUPPORT_RECOMMENDED_ARGS=-Dmail.smtp.ssl.protocols=TLSv1.2 -Dupm.pac.disable=true --Datlassian.upm.signature.check.disabled=true
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8090/status"]
            start_period: 60s
            interval: 30s
            retries: 5
            timeout: 5s
        image: wbappcmshome:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.wbappcmshome.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.wbappcmshome.rule=Host(`${WBHOME_DOMAIN}`) || Host(`${DOMAIN_NAME}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.wbappcmshome.service=wbappcmshome"
            # Define the internal container port for routing
            - "traefik.http.services.wbappcmshome.loadbalancer.server.port=8090"
            # Enable TLS on this router
            - "traefik.http.routers.wbappcmshome.tls=true"
            # Apply a compression middleware
            - "traefik.http.routers.wbappcmshome.middlewares=secure-chain@file,wbappcmshome-compress"
            # Define settings for the compression middleware
            - "traefik.http.middlewares.wbappcmshome-compress.compress=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.wbappcmshome.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/webapps/confluence:/var/atlassian/application-data/confluence

    # wbappwebchat — Open WebUI LLM chat interface. Docs: shared/openwebui/README.md
    wbappwebchat:
        build:
            context: ../shared/openwebui/
        depends_on:
            routetraefik:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
        image: wbappwebchat:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.wbappwebchat.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.wbappwebchat.rule=Host(`${OWEBUI_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.wbappwebchat.service=wbappwebchat"
            # Define the internal container port for routing
            - "traefik.http.services.wbappwebchat.loadbalancer.server.port=8080"
            # Enable TLS on this router
            - "traefik.http.routers.wbappwebchat.tls=true"
            # Rate limit + security headers (defined in shared/traefik/advanced/middlewares-security.yml)
            - "traefik.http.routers.wbappwebchat.middlewares=secure-chain@file"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.wbappwebchat.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/openwebui:/app/backend/data

    # wbappdriveinit — oCIS config/data directory ownership initialiser. Docs: shared/owncloud/README.md
    wbappdriveinit:
        command: >
            sh -c 'mkdir -p /config /data &&
                   chown -R 1000:1000 /config /data &&
                   chmod -R 751 /config /data'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/cloud/ocis/config:/config
            - ${APPS_DATA}/cloud/ocis/data:/data

    # wbappmydrive — ownCloud Infinite Scale cloud drive. Docs: shared/owncloud/README.md
    wbappmydrive:
        build:
            context: ../shared/owncloud/
            args:
                - IMAGE_TAG=${WBDRIVE_TAG}
        depends_on:
            authnservice:
                condition: service_healthy
            routetraefik:
                condition: service_healthy
            wbappdriveinit:
                condition: service_completed_successfully
        environment:
            - TZ=${TIME_ZONE}
            - OCIS_CONFIG_DIR=/etc/ocis
            - OCIS_URL=https://${WBDRIVE_DOMAIN}
            - OCIS_LOG_LEVEL=info
            - OCIS_LOG_COLOR=false
            - OCIS_LOG_PRETTY=false
            # Traefik terminates TLS; oCIS receives plain HTTP internally.
            - PROXY_TLS=false
            # Use Authentik as the external OIDC provider instead of the built-in IDP.
            - OCIS_EXCLUDE_RUN_SERVICES=idp
            - OCIS_OIDC_ISSUER=${WBDRIVE_OIDC_ISSUER}
            - PROXY_OIDC_REWRITE_WELLKNOWN=true
            - WEB_OIDC_CLIENT_ID=${WBDRIVE_OIDC_CLIENT_ID}
            - WEB_OIDC_SCOPE=openid profile email
            - WEB_OIDC_POST_LOGOUT_REDIRECT_URI=https://${WBDRIVE_DOMAIN}/
            # Provision oCIS accounts on first successful Authentik sign-in.
            - PROXY_AUTOPROVISION_ACCOUNTS=true
            - PROXY_USER_OIDC_CLAIM=preferred_username
            - PROXY_USER_CS3_CLAIM=username
            - GRAPH_ASSIGN_DEFAULT_USER_ROLE=true
            - GRAPH_USERNAME_MATCH=none
            - OCIS_ADMIN_USER_ID=admin
            - PROXY_ENABLE_BASIC_AUTH=false
            - IDM_CREATE_DEMO_USERS=false
            # Set true only when Authentik uses a self-signed certificate.
            - OCIS_INSECURE=${WBDRIVE_INSECURE}
        healthcheck:
            test: [ "CMD", "curl", "-fsS", "http://localhost:9200/status.php" ]
            start_period: 60s
            interval: 30s
            retries: 5
            timeout: 5s
        image: wbappmydrive:latest
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.wbappmydrive.entrypoints=websecure"
            - "traefik.http.routers.wbappmydrive.rule=Host(`${WBDRIVE_DOMAIN}`)"
            - "traefik.http.routers.wbappmydrive.service=wbappmydrive"
            - "traefik.http.services.wbappmydrive.loadbalancer.server.port=9200"
            - "traefik.http.routers.wbappmydrive.tls=true"
            - "traefik.http.routers.wbappmydrive.middlewares=secure-chain@file"
            - "traefik.http.routers.wbappmydrive.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/cloud/ocis/config:/etc/ocis
            - ${APPS_DATA}/cloud/ocis/data:/var/lib/ocis
