services:
    # wbappcmshome — Confluence homepage / CMS. Docs: shared/confluence/README.md
    wbappcmshome:
        build:
            context: ../shared/confluence/
            args:
                - IMAGE_TAG=${WBHOME_TAG}
        depends_on:
            authnservice:
                condition: service_healthy
        environment:
            - ATL_PROXY_NAME=${WBHOME_DOMAIN}
            - ATL_PROXY_PORT=443
            - JVM_MAXIMUM_MEMORY=3072m
            - JVM_MINIMUM_MEMORY=1024m
            - ATL_TOMCAT_PORT=8090
            - ATL_TOMCAT_SCHEME=https
            - ATL_TOMCAT_MAXTHREADS=48
            - ATL_TOMCAT_MINSPARETHREAD=6
            - ATL_TOMCAT_MAXHTTPHEADERSIZE=8192
            - ATL_DB_POOLMAXSIZE=125
            - ATL_DB_TYPE=postgresql
            - ATL_JDBC_URL=jdbc:postgresql://${PGRSQL_HOST}:${PGRSQL_PORT}/${WBHOME_DBNAME}
            - ATL_JDBC_USER=${SQLDB_USER}
            - ATL_JDBC_PASSWORD=${SQLDB_PASS}
            - JVM_SUPPORT_RECOMMENDED_ARGS=-Dmail.smtp.ssl.protocols=TLSv1.2 -Dupm.pac.disable=true --Datlassian.upm.signature.check.disabled=true
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8090/status"]
            start_period: 60s
            interval: 30s
            retries: 5
            timeout: 5s
        image: wbappcmshome:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.wbappcmshome.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.wbappcmshome.rule=Host(`${WBHOME_DOMAIN}`) || Host(`${DOMAIN_NAME}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.wbappcmshome.service=wbappcmshome"
            # Define the internal container port for routing
            - "traefik.http.services.wbappcmshome.loadbalancer.server.port=8090"
            # Enable TLS on this router
            - "traefik.http.routers.wbappcmshome.tls=true"
            # Apply a compression middleware
            - "traefik.http.routers.wbappcmshome.middlewares=wbappcmshome-compress"
            # Define settings for the compression middleware
            - "traefik.http.middlewares.wbappcmshome-compress.compress=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.wbappcmshome.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/webapps/confluence:/var/atlassian/application-data/confluence

    # wbappwebchat — Open WebUI LLM chat interface. Docs: shared/openwebui/README.md
    wbappwebchat:
        build:
            context: ../shared/openwebui/
        depends_on:
            routetraefik:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
        image: wbappwebchat:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.wbappwebchat.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.wbappwebchat.rule=Host(`${OWEBUI_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.wbappwebchat.service=wbappwebchat"
            # Define the internal container port for routing
            - "traefik.http.services.wbappwebchat.loadbalancer.server.port=8080"
            # Enable TLS on this router
            - "traefik.http.routers.wbappwebchat.tls=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.wbappwebchat.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/openwebui:/app/backend/data