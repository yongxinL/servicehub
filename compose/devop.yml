services:
    # devopbldinit — one-shot: create DevOps data dirs, chown 1000:1000. Docs: shared/forgejo/README.md
    devopbldinit:
        command: >
            sh -c 'mkdir -p /data /var/lib/forgejo-runner &&
                   chown -R 1000:1000 /data /var/lib/forgejo-runner'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${APPS_DATA}/devops/repos:/data
            - ${APPS_DATA}/devops/buildexec:/var/lib/forgejo-runner

    # devopgitserv — Forgejo git server + Actions (HTTPS clone via Traefik; SSH not published — use HTTPS clones). Docs: shared/forgejo/README.md
    devopgitserv:
        build:
            context: ../shared/forgejo/server/
            args:
                - IMAGE_TAG=${GITREPO_VTAG}
        depends_on:
            dbsvcpgsqldb:
                condition: service_healthy
            authnservice:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            - USER_UID=1000
            - USER_GID=1000
            - FORGEJO__server__DOMAIN=${GITREPO_DOMAIN}
            - FORGEJO__server__ROOT_URL=https://${GITREPO_DOMAIN}/
            # SSH port is not published; advertise HTTPS clone URLs only
            - FORGEJO__server__DISABLE_SSH=true
            - FORGEJO__database__DB_TYPE=postgres
            - FORGEJO__database__HOST=${PGRSQL_HOST}:${PGRSQL_PORT}
            - FORGEJO__database__NAME=${GITREPO_DBNAME}
            - FORGEJO__database__USER=${SQLDB_USER}
            - FORGEJO__database__PASSWD=${SQLDB_PASS}
            - FORGEJO__openid__ENABLE_OPENID_SIGNIN=false
            - FORGEJO__openid__ENABLE_OPENID_SIGNUP=false
            - FORGEJO__actions__ENABLED=true
        healthcheck:
            test: [ "CMD", "curl", "-fsS", "http://localhost:3000/api/healthz" ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        image: devopgitserv:latest
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.devopgitserv.entrypoints=websecure"
            - "traefik.http.routers.devopgitserv.rule=Host(`${GITREPO_DOMAIN}`)"
            - "traefik.http.routers.devopgitserv.service=devopgitserv"
            - "traefik.http.services.devopgitserv.loadbalancer.server.port=3000"
            - "traefik.http.routers.devopgitserv.tls=true"
            - "traefik.http.routers.devopgitserv.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - ${APPS_DATA}/devops/repos:/data

    # devopgitexec — Forgejo Actions runner using host-mode execution.
    # Workflow jobs run inside this runner container and deploy to Docker hosts
    # over SSH. No temporary job container or Docker socket is required.
    # Docs: shared/forgejo/README.md
    devopgitexec:
        build:
            context: ../shared/forgejo/actions/
            args:
                - IMAGE_TAG=${GITBLD_VTAG}
        depends_on:
            devopbldinit:
                condition: service_completed_successfully
            devopgitserv:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            - GITBLD_AGN_SECRET=${GITBLD_AGN_SECRET}
            - FORGEJO_INSTANCE_URL=http://devopgitserv:3000
            - FORGEJO_RUNNER_NAME=devopgitexec
        # The runner daemon has no HTTP endpoint; the healthcheck verifies the
        # daemon process is alive and the registration file is non-empty.
        # `pidof` is provided by Alpine's busybox and is always available.
        healthcheck:
            test: ["CMD-SHELL", "pidof forgejo-runner > /dev/null && [ -s /var/lib/forgejo-runner/.runner ]"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        image: devopgitexec:latest
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - /etc/localtime:/etc/localtime:ro
            # Version-controlled runtime configuration.
            - ../shared/forgejo/actions/config.yml:/etc/forgejo-runner/config.yml:ro
            # Persistent registration identity and runner data.
            - ${APPS_DATA}/devops/buildexec:/var/lib/forgejo-runner
            # Host-mode job workspace.
            - ${APPS_DATA}/devops/workspace:/workspace
