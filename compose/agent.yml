services:
    # agsvchermint — one-shot: set ownership of the 4 Hermes data dirs. Docs: shared/hermesagent/README.md
    agsvchermint:
        command: >
            sh -c 'chown -R 10000:10000 /data00 /data01 /data02 /data03;
                   chmod -R 775 /data00 /data01 /data02 /data03'
        image: busybox:latest
        networks:
            - subnet
        user: root
        volumes:
            - ${HERMES_DATA_00:-${APPS_DATA}/hermesagent/00}:/data00
            - ${HERMES_DATA_01:-${APPS_DATA}/hermesagent/01}:/data01
            - ${HERMES_DATA_02:-${APPS_DATA}/hermesagent/02}:/data02
            - ${HERMES_DATA_03:-${APPS_DATA}/hermesagent/03}:/data03

    # agsvcherme00 — Hermes Agent (user 0). Docs: shared/hermesagent/README.md
    # Note: /var/run/docker.sock is mounted read-only for the terminal sandbox.
    # If the host docker group GID differs from 999, add group_add: [<host-gid>]
    agsvcherme00:
        build:
            context: ../shared/hermesagent/
        depends_on:
            agsvchermint:
                condition: service_completed_successfully
        environment:
            - TZ=${TIME_ZONE}
            - HOME=/opt/data
            # Internal workspace port is always 12320; external port mapped via 'ports' below.
            - HERMES_WORKSPACE_PORT=12320
            - LITELLM_API_KEY=${LITEM_API_KEY}
            - LITELLM_API_URL=${LITEM_API_URL:-http://agsvclitellm:12380/v1}
            - FIRECRAWL_API_URL=${FCRW_API_URL:-http://agsvcfastcrw:12360}
            - FIRECRAWL_API_KEY=${LITEM_API_KEY}
            - API_SERVER_ENABLED=true
            - API_SERVER_KEY=${LITEM_API_KEY}
            - API_SERVER_PORT=12330
            - API_SERVER_HOST=0.0.0.0
            - HERMES_WORKSPACE_PASSWORD=${HERMES_WORKSPACE_PASSWD_00}
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:12330/health" ]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        image: agsvcherme00:latest
        networks:
            - subnet
        ports:
            - "12320:12320"    # Hermes workspace
        restart: unless-stopped
        volumes:
            - ${HERMES_DATA_00:-${APPS_DATA}/hermesagent/00}:/opt/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.agsvcherme00.enabled=${HERMES_WORKSPACE_DOMAIN_00:+true}"
            - "traefik.http.routers.agsvcherme00.rule=Host(`${HERMES_WORKSPACE_DOMAIN_00}`)"
            - "traefik.http.routers.agsvcherme00.tls=true"
            - "traefik.http.routers.agsvcherme00.tls.certresolver=${CERTRESOLVER}"
            - "traefik.http.services.agsvcherme00.loadbalancer.server.port=12320"

    # agsvcherme01 — Hermes Agent (user 1). Docs: shared/hermesagent/README.md
    agsvcherme01:
        build:
            context: ../shared/hermesagent/
        depends_on:
            agsvchermint:
                condition: service_completed_successfully
        environment:
            - TZ=${TIME_ZONE}
            - HOME=/opt/data
            # Internal workspace port is always 12320; external port mapped via 'ports' below.
            - HERMES_WORKSPACE_PORT=12320
            - LITELLM_API_KEY=${LITEM_API_KEY}
            - LITELLM_API_URL=${LITEM_API_URL:-http://agsvclitellm:12380/v1}
            - FIRECRAWL_API_URL=${FCRW_API_URL:-http://agsvcfastcrw:12360}
            - FIRECRAWL_API_KEY=${LITEM_API_KEY}
            - API_SERVER_ENABLED=true
            - API_SERVER_KEY=${LITEM_API_KEY}
            - API_SERVER_PORT=12330
            - API_SERVER_HOST=0.0.0.0
            - HERMES_WORKSPACE_PASSWORD=${HERMES_WORKSPACE_PASSWD_01}
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:12330/health" ]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        image: agsvcherme00:latest
        networks:
            - subnet
        ports:
            - "12321:12320"    # Hermes workspace
        restart: unless-stopped
        volumes:
            - ${HERMES_DATA_01:-${APPS_DATA}/hermesagent/01}:/opt/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.agsvcherme01.enabled=${HERMES_WORKSPACE_DOMAIN_01:+true}"
            - "traefik.http.routers.agsvcherme01.rule=Host(`${HERMES_WORKSPACE_DOMAIN_01}`)"
            - "traefik.http.routers.agsvcherme01.tls=true"
            - "traefik.http.routers.agsvcherme01.tls.certresolver=${CERTRESOLVER}"
            - "traefik.http.services.agsvcherme01.loadbalancer.server.port=12320"

    # agsvcherme02 — Hermes Agent (user 2). Docs: shared/hermesagent/README.md
    agsvcherme02:
        build:
            context: ../shared/hermesagent/
        depends_on:
            agsvchermint:
                condition: service_completed_successfully
        environment:
            - TZ=${TIME_ZONE}
            - HOME=/opt/data
            # Internal workspace port is always 12320; external port mapped via 'ports' below.
            - HERMES_WORKSPACE_PORT=12320
            - LITELLM_API_KEY=${LITEM_API_KEY}
            - LITELLM_API_URL=${LITEM_API_URL:-http://agsvclitellm:12380/v1}
            - FIRECRAWL_API_URL=${FCRW_API_URL:-http://agsvcfastcrw:12360}
            - FIRECRAWL_API_KEY=${LITEM_API_KEY}
            - API_SERVER_ENABLED=true
            - API_SERVER_KEY=${LITEM_API_KEY}
            - API_SERVER_PORT=12330
            - API_SERVER_HOST=0.0.0.0
            - HERMES_WORKSPACE_PASSWORD=${HERMES_WORKSPACE_PASSWD_02}
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:12330/health" ]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        image: agsvcherme00:latest
        networks:
            - subnet
        ports:
            - "12322:12320"    # Hermes workspace
        restart: unless-stopped
        volumes:
            - ${HERMES_DATA_02:-${APPS_DATA}/hermesagent/02}:/opt/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.agsvcherme02.enabled=${HERMES_WORKSPACE_DOMAIN_02:+true}"
            - "traefik.http.routers.agsvcherme02.rule=Host(`${HERMES_WORKSPACE_DOMAIN_02}`)"
            - "traefik.http.routers.agsvcherme02.tls=true"
            - "traefik.http.routers.agsvcherme02.tls.certresolver=${CERTRESOLVER}"
            - "traefik.http.services.agsvcherme02.loadbalancer.server.port=12320"

    # agsvcherme03 — Hermes Agent (user 3). Docs: shared/hermesagent/README.md
    agsvcherme03:
        build:
            context: ../shared/hermesagent/
        depends_on:
            agsvchermint:
                condition: service_completed_successfully
        environment:
            - TZ=${TIME_ZONE}
            - HOME=/opt/data
            # Internal workspace port is always 12320; external port mapped via 'ports' below.
            - HERMES_WORKSPACE_PORT=12320
            - LITELLM_API_KEY=${LITEM_API_KEY}
            - LITELLM_API_URL=${LITEM_API_URL:-http://agsvclitellm:12380/v1}
            - FIRECRAWL_API_URL=${FCRW_API_URL:-http://agsvcfastcrw:12360}
            - FIRECRAWL_API_KEY=${LITEM_API_KEY}
            - API_SERVER_ENABLED=true
            - API_SERVER_KEY=${LITEM_API_KEY}
            - API_SERVER_PORT=12330
            - API_SERVER_HOST=0.0.0.0
            - HERMES_WORKSPACE_PASSWORD=${HERMES_WORKSPACE_PASSWD_03}
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:12330/health" ]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        image: agsvcherme00:latest
        networks:
            - subnet
        ports:
            - "12323:12320"    # Hermes workspace
        restart: unless-stopped
        volumes:
            - ${HERMES_DATA_03:-${APPS_DATA}/hermesagent/03}:/opt/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.agsvcherme03.enabled=${HERMES_WORKSPACE_DOMAIN_03:+true}"
            - "traefik.http.routers.agsvcherme03.rule=Host(`${HERMES_WORKSPACE_DOMAIN_03}`)"
            - "traefik.http.routers.agsvcherme03.tls=true"
            - "traefik.http.routers.agsvcherme03.tls.certresolver=${CERTRESOLVER}"
            - "traefik.http.services.agsvcherme03.loadbalancer.server.port=12320"

    # agsvclitellm — LiteLLM complexity router (local Gemma + MiniMax).
    # Docs: README.md#litellm-proxy--agsvclitellm
    agsvclitellm:
        build:
            context: ../shared/litellm/
        depends_on:
            dbsvcpgsqldb:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
            - LLM_MASTER_KEY=${LITEM_API_KEY}
            - DATABASE_URL=postgresql://${SQLDB_USER}:${SQLDB_PASS}@${PGRSQL_HOST}:${PGRSQL_PORT}/${LITEM_DBNAME}
            - UI_PORT=12380
            - UI_USERNAME=${LITEM_ADMUSR}
            - UI_PASSWORD=${LITEM_ADMPWD}
            # Edge — local llama.cpp or remote edge service
            - LITEM_EDGE_API_BASE=${LITEM_HPH_APIURL:-http://agsvcchatllm:12386/v1}
            - LITEM_EDGE_API_KEY=${LITEM_HPH_APIKEY:-none}
            # Health check for auto-failover routing (used by smartrouter.py)
            - LITEM_EDGE_HEALTH_URL=${LITEM_HPH_HLTURL:-http://agsvcchatllm:12386/health}
            - LITEM_EDGE_HEALTH_TIMEOUT=3
            - LITEM_EDGE_HEALTH_CACHE_TTL=30
            # Cloud — public or remote cloud provider
            - LITEM_CLOUD_API_BASE=${LITEM_PRM_APIBASE}
            - LITEM_CLOUD_API_KEY=${LITEM_PRM_APIKEY}
        healthcheck:
            test: [ "CMD", "curl", "-sf", "-H", "Authorization: Bearer ${LITEM_API_KEY}", "http://localhost:12380/health/liveliness" ]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        image: agsvclitellm:latest
        networks:
            - subnet
        ports:
            - 12380:12380
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/litellm:/opt/litellm   # place config.yaml here to override default

    # wbsvcwebchat — Open WebUI. Docs: README.md#open-webui
    wbsvcwebchat:
        build:
            context: ../shared/openwebui/
        depends_on:
            routetraefik:
                condition: service_healthy
        environment:
            - TZ=${TIME_ZONE}
        image: wbsvcwebchat:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.wbsvcwebchat.entrypoints=websecure"
            # Match incoming requests on a specific hostname
            - "traefik.http.routers.wbsvcwebchat.rule=Host(`${OWEBUI_DOMAIN}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.wbsvcwebchat.service=wbsvcwebchat"
            # Define the internal container port for routing
            - "traefik.http.services.wbsvcwebchat.loadbalancer.server.port=8080"
            # Enable TLS on this router
            - "traefik.http.routers.wbsvcwebchat.tls=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.wbsvcwebchat.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/openwebui:/app/backend/data

    # agsvcchatllm — llama.cpp Gemma chat inference.
    # Docs: README.md#chat-inference--agsvcchatllm
    agsvcchatllm:
        build:
            context: ../shared/llamacpp/
        cap_add:
            - IPC_LOCK           # required for --mlock to work inside Docker
        environment:
            - TZ=${TIME_ZONE}
            - LLAMA_CACHE=/models
            - LLAMA_MODEL=${LLAMA_CHTMDL}
            - LLAMA_PORT=12386
            - LLAMA_ARGS=${LLAMA_CHTARG}
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:12386/health" ]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 120s   # 5.6 GB model + mmproj; ~60-90s to mlock into RAM
        image: agsvcchatllm:latest
        networks:
            - subnet
        restart: unless-stopped
        ports:
            - 12386:12386
        ulimits:
            memlock:
                soft: -1
                hard: -1         # unlimited memlock — needed alongside IPC_LOCK
        volumes:
            - ${APPS_DATA}/llamacpp:/models

    # agsvcfastcrw — Firecrawl-compatible crawler / search. Docs: shared/fastcrw/README.md
    agsvcfastcrw:
        build:
            context: ../shared/fastcrw/
        depends_on:
            agsvclighpda:
                condition: service_healthy
            agsvcsearxng:
                condition: service_healthy
            agsvcchromum:
                condition: service_healthy
        environment:
            - RUST_LOG=info
            - CRW_CONFIG=config.docker
            - CRW_SERVER__PORT=12360
            - CRW_CRAWLER__REQUESTS_PER_SECOND=5.0
            # renderer urls, search url, and auth key are all set in
            # config.docker.toml and substituted by entrypoint.sh at startup.
            - FIRECRAWL_API_KEY=${LITEM_API_KEY}
        image: agsvcfastcrw:latest
        networks:
            - subnet
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12360"]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 15s
        volumes:
            - ../shared/fastcrw/config.docker.toml:/app/config.docker.toml:ro

    # agsvclighpda — LightPanda JS renderer (lightweight tier). Docs: shared/fastcrw/README.md
    # `restart: unless-stopped` is load-bearing: LightPanda can OOM/segfault on
    # adversarial pages, and without auto-restart every JS request falls through
    # to Chrome. `mem_limit` keeps a runaway tab from dragging the host into swap.
    agsvclighpda:
        build:
            context: ../shared/fastcrw/lightpanda/
        healthcheck:
            test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12362"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        image: agsvclighpda:latest
        mem_limit: 1g
        memswap_limit: 1g
        networks:
            - subnet
        restart: unless-stopped

    # agsvcchromum — Browserless Chromium stealth renderer (fallback tier).
    # Docs: shared/fastcrw/README.md
    agsvcchromum:
        build:
            context: ../shared/fastcrw/chromium/
        environment:
            # TOKEN is required by browserless v2 — clients must pass `?token=...`.
            # Default is a published placeholder; override via `.env` in production:
            #   echo "BROWSERLESS_TOKEN=$(openssl rand -hex 24)" >> .env
            - TOKEN=${LITEM_API_KEY:-agsvcfcrwche}
            - PORT=12363
            - CONCURRENT=15
            - MAX_QUEUE_LENGTH=30
            - TIMEOUT=30000
            # Kill the container instead of accepting traffic in a degraded state;
            # without this, browserless can wedge in "healthy but refusing CDP".
            - EXIT_ON_HEALTH_FAILURE=true
        healthcheck:
            # TCP accept on browserless's listen port. App-level CDP failures
            # (chromium pool wedged, /chromium routing broken) are caught by
            # browserless's own supervision via `EXIT_ON_HEALTH_FAILURE=true`
            # above — it kills the container and `restart: unless-stopped`
            # brings it back up. A bash-based HTTP probe with token
            # interpolation is fragile (compose-vs-runtime expansion of $TOKEN,
            # and short-lived /dev/tcp FDs racing with HTTP/1.0 connection close)
            # and gave us nothing this combo doesn't already.
            test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12363"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        image: agsvcfcrwche:latest
        mem_limit: 3g
        memswap_limit: 3g
        networks:
            - subnet
        restart: unless-stopped
        shm_size: "2g"
        # Confine browserless's user-data-dirs and downloads to tmpfs so a
        # runaway session can't fill the host disk (we hit ENOSPC during
        # bench tuning when this was missing). Browserless v2 writes session
        # state under /tmp by default, so a single bounded tmpfs is enough.
        tmpfs:
            - /tmp:size=512m

    # agsvcsearxng — SearXNG search backend. Docs: shared/fastcrw/README.md
    agsvcsearxng:
        build:
            context: ../shared/searxng/
        environment:
            - TZ=${TIME_ZONE}
            - SEARXNG_PORT=12361
            - SEARXNG_BIND_ADDRESS=0.0.0.0
            - SEARXNG_BASE_URL=http://agsvcsearxng:12361
            - SEARXNG_SECRET=${LITEM_API_KEY:-agsvcsearxng}
        image: agsvcsearxng:latest
        networks:
            - subnet
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "/usr/sbin/wget", "-qO", "/dev/null", "http://localhost:12361/healthz"]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 15s