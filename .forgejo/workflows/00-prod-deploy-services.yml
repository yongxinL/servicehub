# Forgejo Actions deployment workflow for ServiceHub.
#
# Deploys this repository to a remote Docker server over SSH. The runner checks
# out the selected branch, decrypts git-crypt files in the checkout, and syncs
# the working tree to the target with rsync — the target never receives git
# metadata (.git, .gitignore, .gitattributes) or repository-only files
# (.forgejo/, AGENTS.md, docs/), and needs neither git nor git-crypt.
#
# Triggers:
#   - workflow_dispatch (Run workflow button in the Forgejo UI, or the
#     POST /repos/{owner}/{repo}/actions/workflows/00-prod-deploy-services.yml/dispatches API)
#
# Inputs (same as the previous Gitea Actions workflow):
#   - service:     app service to deploy, or "all" (default). Foundational
#                  services (infra*, devops*, route*) are never deployed
#                  by CI. AI platform (aiserv*) and observability (obsvce*)
#                  services are outside the OCI deploy scope (ADR-009) and
#                  are not offered here.
#   - environment: deploy target, stag (default) or prod
#   - branch:      branch to deploy (default main)
#
# Secrets are read from the Forgejo repository secret store: see README.md
# (Repository -> Settings -> Actions -> Secrets).

name: deploy

on:
  workflow_dispatch:
    inputs:
      # Same inputs as the previous Gitea Actions workflow
      # (.gitea/workflows/deploy.yml at commit 60c3c0c): service dropdown,
      # environment and branch.
      # Foundational services (databases, Authentik, Forgejo + runner, Traefik)
      # are deliberately absent: they are deployed manually, and deploying
      # Forgejo would kill the runner mid-deploy. Traefik needs no restart —
      # its Docker provider discovers new containers via labels automatically.
      service:
        description: 'Service to deploy (or "all" app services)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - webappconf
          - webappocis
          - mailsvstalwart
          - mailsvbulwark
      environment:
        description: 'Target environment'
        required: true
        default: 'stag'
        type: choice
        options:
          - stag
          - prod
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

# Never run two deployments at once.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Host-mode runner: the job runs directly in the devopsrunner container,
    # which already ships git/openssh/sshpass (shared/forgejo/actions/Dockerfile).
    runs-on: ssh-deploy
    steps:
      - name: Checkout
        # Uses the automatic GITHUB_TOKEN, so private repositories clone fine.
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Deploy
        # Deploy logic lives here so the workflow is self-contained; inputs and
        # secrets are mapped to environment variables below.
        #
        #   DEPLOY_TARGET        stag|prod (default: stag)
        #   DEPLOY_TASK          app service name, or "all"/empty for all app
        #                        services. Foundational services (infra*,
        #                        devops*, route*) are never deployed here.
        #   BRANCH               branch to deploy (default: main)
        #   GIT_CRYPT_KEY        base64-encoded git-crypt symmetric key,
        #                        unlocked in the runner checkout before sync
        #
        # SSH auth: set ${PREFIX}_SERVER_PASS (password) OR ${PREFIX}_SERVER_KEY
        # (private key, passwordless). If both are set the key takes precedence.
        # When using a key, the corresponding public key must already be in
        # ~/.ssh/authorized_keys on the target server. The target needs rsync.
        # Optional ${PREFIX}_SERVER_PORT sets a non-default SSH port (22).
        run: |
          set -e

          # --- resolve target and inputs ------------------------------------
          [ -n "$DEPLOY_TARGET" ] || DEPLOY_TARGET=stag
          DEPLOY_TARGET=$(printf '%s' "$DEPLOY_TARGET" | tr '[:upper:]' '[:lower:]')
          [ -n "$DEPLOY_TASK" ] || DEPLOY_TASK=all
          [ -n "$BRANCH" ] || BRANCH=main
          [ -n "$GIT_CRYPT_KEY" ] || GIT_CRYPT_KEY=

          case "$DEPLOY_TARGET" in
            stag) PREFIX=STAG ;;
            prod) PREFIX=PROD ;;
            *) echo "Error: unknown DEPLOY_TARGET '$DEPLOY_TARGET' (expected stag or prod)" >&2; exit 1 ;;
          esac

          get() { eval "printf '%s' \"\${$1:-}\""; }

          # Connection and backup-independent settings live in one JSON
          # variable per environment (see README, ${PREFIX}_CONFIG). Credentials and the
          # large encoded blobs stay as individual secrets.
          CONFIG_JSON=$(get "${PREFIX}_CONFIG")
          SERVER_PASSWORD=$(get "${PREFIX}_SERVER_PASS")
          SERVER_KEY=$(get "${PREFIX}_SERVER_KEY")
          ENV_B64=$(get "${PREFIX}_B64ENC_ENVS")
          ACME_B64=$(get "${PREFIX}_B64ENC_ACME")

          [ -n "$CONFIG_JSON" ] || { echo "Error: ${PREFIX}_CONFIG is not set" >&2; exit 1; }
          command -v jq >/dev/null 2>&1 || { echo "Error: required command 'jq' not found (runner image)" >&2; exit 1; }
          cfg() {
            printf '%s' "$CONFIG_JSON" | jq -r --arg k "$1" \
              'if (.[$k] | type) == "string" then .[$k]
               elif (.[$k] | type) == "number" then (.[$k] | tostring)
               else empty end' ||
              { echo "Error: ${PREFIX}_CONFIG is not valid JSON" >&2; exit 1; }
          }

          SERVER_HOST=$(cfg server_host)
          SERVER_USER=$(cfg server_user)
          SERVER_PORT=$(cfg server_port)
          DEPLOY_PATH=$(cfg deploy_path)
          SSH_KNOWN_HOST=$(cfg sshkwn_keys)

          [ -n "$SERVER_HOST" ] || { echo "Error: ${PREFIX}_CONFIG.server_host is not set" >&2; exit 1; }
          [ -n "$SERVER_USER" ] || { echo "Error: ${PREFIX}_CONFIG.server_user is not set" >&2; exit 1; }
          [ -n "$SERVER_PORT" ] || SERVER_PORT=22
          case "$SERVER_PORT" in
            *[!0-9]*) echo "Error: ${PREFIX}_CONFIG.server_port must be a port number" >&2; exit 1 ;;
          esac
          if [ -z "$SERVER_PASSWORD" ] && [ -z "$SERVER_KEY" ]; then
            echo "Error: ${PREFIX}_SERVER_PASS or ${PREFIX}_SERVER_KEY must be set" >&2; exit 1
          fi
          [ -n "$DEPLOY_PATH" ] || { echo "Error: ${PREFIX}_CONFIG.deploy_path is not set" >&2; exit 1; }

          command -v ssh >/dev/null 2>&1 || { echo "Error: required command 'ssh' not found" >&2; exit 1; }
          command -v rsync >/dev/null 2>&1 || { echo "Error: required command 'rsync' not found (runner image)" >&2; exit 1; }
          if [ -z "$SERVER_KEY" ]; then
            command -v sshpass >/dev/null 2>&1 || { echo "Error: required command 'sshpass' not found (needed for password auth)" >&2; exit 1; }
          fi

          # When using key auth, materialize the private key into a temp file
          # with 0600 perms (ssh refuses more permissive key files). The trap
          # cleans up both temp files on exit regardless of success or failure.
          SSH_KEY_FILE=
          if [ -n "$SERVER_KEY" ]; then
            SSH_KEY_FILE=$(mktemp)
            chmod 600 "$SSH_KEY_FILE"
            # Strip CR so keys stored via the Forgejo HTTP API (CRLF) still parse.
            printf '%s\n' "$SERVER_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          fi
          KNOWN_HOSTS_FILE=$(mktemp)
          trap 'rm -f "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE"' EXIT

          echo "Deploying '$DEPLOY_TASK' from branch '$BRANCH' to $DEPLOY_TARGET ($SERVER_USER@$SERVER_HOST:$DEPLOY_PATH)"

          # --- SSH host verification ----------------------------------------
          # ssh reads ~/.ssh/known_hosts via the passwd home, not $HOME: the
          # runner image runs as root but sets HOME=/data, so ~ resolves to
          # /data while ssh looks in /root. An explicit file keeps them in sync.
          if [ -n "$SSH_KNOWN_HOST" ]; then
            printf '%s\n' "$SSH_KNOWN_HOST" >> "$KNOWN_HOSTS_FILE"
          else
            echo "WARNING: ${PREFIX}_CONFIG.sshkwn_keys not set; falling back to ssh-keyscan" >&2
            ssh-keyscan -H -p "$SERVER_PORT" "$SERVER_HOST" >> "$KNOWN_HOSTS_FILE"
          fi
          [ -s "$KNOWN_HOSTS_FILE" ] || { echo "Error: no SSH host keys for $SERVER_HOST (set ${PREFIX}_CONFIG.sshkwn_keys)" >&2; exit 1; }
          chmod 600 "$KNOWN_HOSTS_FILE"

          ssh_exec() {
            if [ -n "$SERVER_KEY" ]; then
              # BatchMode: never prompt (passphrase-protected keys fail fast
              # instead of hanging the job; use a passphrase-less key).
              ssh -p "$SERVER_PORT" -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" "$SERVER_USER@$SERVER_HOST" "$@"
            else
              SSHPASS="$SERVER_PASSWORD" sshpass -e ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" "$SERVER_USER@$SERVER_HOST" "$@"
            fi
          }

          # --- decrypt git-crypt files in the runner checkout ----------------
          # Certificates under shared/traefik/advanced/selfsigncert/ are
          # encrypted at rest in the repository. The decrypted working tree is
          # what gets synced; the target never needs git or git-crypt.
          if [ -n "$GIT_CRYPT_KEY" ]; then
            printf '%s' "$GIT_CRYPT_KEY" | base64 -d > /tmp/gcrypt.key
            git crypt unlock /tmp/gcrypt.key 2>/dev/null ||
              echo "WARNING: git-crypt unlock skipped (repository may not be initialised)" >&2
            rm -f /tmp/gcrypt.key
          fi

          # --- sync the working tree (no git metadata on the target) ----------
          # Never transferred and removed from the target, so deployments made
          # by the old clone-based workflow migrate cleanly:
          #   .git .gitignore .gitattributes .forgejo AGENTS.md docs
          # Protected from --delete instead (restored or regenerated below):
          #   .env (newest-file-wins restore), admin-routers.yml and *.b64
          #   (regenerated by scripts/setup.sh).
          # Root-anchored patterns (/name) only match top-level entries; .env
          # and *.b64 stay unanchored so nested copies are protected too.
          KEEP_EXCLUDES="--exclude=/.git --exclude=.env --exclude=/.gitignore --exclude=/.gitattributes"
          KEEP_EXCLUDES="$KEEP_EXCLUDES --exclude=/.forgejo --exclude=/AGENTS.md --exclude=/docs"
          KEEP_EXCLUDES="$KEEP_EXCLUDES --exclude=shared/traefik/advanced/admin-routers.yml --exclude=*.b64"
          CLEAN_PATHS='.git .gitignore .gitattributes .forgejo AGENTS.md docs'

          ssh_exec "command -v rsync >/dev/null 2>&1 || { echo 'Error: rsync not installed on the target server' >&2; exit 1; }"
          ssh_exec "mkdir -p '$DEPLOY_PATH' && cd '$DEPLOY_PATH' && rm -rf $CLEAN_PATHS"

          # If APPS_DATA resolves inside the deploy path, protect it from
          # --delete rather than trusting that it never will be. The last line
          # is taken so a pre-command ssh banner cannot pollute the answer,
          # while the ssh exit status still fails the deploy on a bad layout.
          APPS_OUT=$(ssh_exec "set -e
          APPS_DATA=\$(grep -E '^APPS_DATA=' '$DEPLOY_PATH/.env' 2>/dev/null | tail -1 | cut -d '=' -f2- | tr -d '\"')
          APPS_DATA=\$(printf '%s' \"\$APPS_DATA\" | sed \"s|^~|\$HOME|\")
          case \"\$APPS_DATA\" in
            '$DEPLOY_PATH') echo 'Error: APPS_DATA must not equal DEPLOY_PATH' >&2; exit 1 ;;
            '$DEPLOY_PATH'/*) rel=\${APPS_DATA#\"$DEPLOY_PATH\"/}; printf '%s' \"\$rel\" ;;
          esac")
          APPS_REL=$(printf '%s\n' "$APPS_OUT" | tail -1)
          if [ -n "$APPS_REL" ]; then
            echo "Protecting APPS_DATA inside the deploy path from --delete: $APPS_REL"
            KEEP_EXCLUDES="$KEEP_EXCLUDES --exclude=$APPS_REL"
          fi

          if [ -n "$SERVER_KEY" ]; then
            RSYNC_RSH="ssh -p $SERVER_PORT -i $SSH_KEY_FILE -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          else
            SSHPASS="$SERVER_PASSWORD"
            export SSHPASS
            RSYNC_RSH="sshpass -e ssh -p $SERVER_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          fi

          echo "Syncing working tree from branch '$BRANCH' to $DEPLOY_TARGET ($SERVER_USER@$SERVER_HOST:$DEPLOY_PATH)"
          rsync -a --delete $KEEP_EXCLUDES -e "$RSYNC_RSH" ./ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

          # --- restore .env (newer file wins) --------------------------------
          if [ -n "$ENV_B64" ]; then
            printf '%s' "$ENV_B64" | ssh_exec "
          set -e
          ENV_PATH='$DEPLOY_PATH/.env'
          base64 -d > /tmp/env_restore.gz
          gunzip -f /tmp/env_restore.gz
          if [ -f \"\$ENV_PATH\" ]; then
            existing_time=\$(stat -c %Y \"\$ENV_PATH\")
            restore_time=\$(stat -c %Y /tmp/env_restore)
            if [ \"\$restore_time\" -gt \"\$existing_time\" ]; then
              echo '.env: secret is newer - restoring from secret'
              cp /tmp/env_restore \"\$ENV_PATH\" && chmod 600 \"\$ENV_PATH\"
            else
              echo '.env: existing file is newer - keeping'
            fi
          else
            echo '.env: not found - restoring from secret'
            cp /tmp/env_restore \"\$ENV_PATH\" && chmod 600 \"\$ENV_PATH\"
          fi
          rm -f /tmp/env_restore /tmp/env_restore.gz"
          fi

          # --- merge any new env.example variables ---------------------------
          ssh_exec "cd '$DEPLOY_PATH' && bash scripts/setup.sh"

          # --- restore acme.json (production, newer file wins) ---------------
          # install sets root:root 600 deterministically; sudo -n fails fast if
          # the deploy user lacks passwordless sudo (server prerequisite).
          if [ -n "$ACME_B64" ]; then
            printf '%s' "$ACME_B64" | ssh_exec "
          set -e
          APPS_DATA=\$(grep -E '^APPS_DATA=' '$DEPLOY_PATH/.env' | tail -1 | cut -d '=' -f2- | tr -d '\"')
          APPS_DATA=\$(printf '%s' \"\$APPS_DATA\" | sed \"s|^~|\$HOME|\")
          [ -n \"\$APPS_DATA\" ] || APPS_DATA=/opt/containerd
          ACME_PATH=\"\$APPS_DATA/shared/certs/acme.json\"
          sudo -n mkdir -p \"\$(dirname \"\$ACME_PATH\")\"
          base64 -d > /tmp/acme_restore.gz
          gunzip -f /tmp/acme_restore.gz
          if [ -f \"\$ACME_PATH\" ]; then
            existing_time=\$(stat -c %Y \"\$ACME_PATH\")
            restore_time=\$(stat -c %Y /tmp/acme_restore)
            if [ \"\$restore_time\" -gt \"\$existing_time\" ]; then
              echo 'acme.json: secret is newer - restoring from secret'
              sudo -n install -m 600 -o root -g root /tmp/acme_restore \"\$ACME_PATH\"
            else
              echo 'acme.json: existing file is newer - keeping'
            fi
          else
            echo 'acme.json: not found - restoring from secret'
            sudo -n install -m 600 -o root -g root /tmp/acme_restore \"\$ACME_PATH\"
          fi
          rm -f /tmp/acme_restore /tmp/acme_restore.gz"
          fi

          # --- deploy on the remote server ------------------------------------
          # Foundational services (databases, Authentik, Forgejo + runner, Traefik)
          # are deployed manually: deploying Forgejo would kill the runner
          # mid-deploy, and Traefik picks up new containers automatically via its
          # Docker provider. --no-deps guarantees a deploy never starts or
          # recreates them either. aiserv* and obsvce* are excluded per
          # ADR-009 even if the local include set ever lists them again.
          REMOTE_CMD="
          set -e
          if command -v docker-compose >/dev/null 2>&1; then COMPOSE='docker-compose'; else COMPOSE='docker compose'; fi
          if [ '$DEPLOY_TASK' = all ]; then
            SERVICES=\$(\$COMPOSE config --services | grep -vE '^(infra|devops|route|aiserv|obsvce)')
            \$COMPOSE up -d --build --no-deps \$SERVICES
          elif [ '$DEPLOY_TASK' = webappocis ]; then
            \$COMPOSE up -d --build webappocisinit
            \$COMPOSE up -d --build --no-deps webappocis
          else
            \$COMPOSE up -d --build --no-deps '$DEPLOY_TASK'
          fi"
          ssh_exec "cd '$DEPLOY_PATH' && $REMOTE_CMD"

          echo "Deployment of '$DEPLOY_TASK' from branch '$BRANCH' to $DEPLOY_TARGET completed"
        env:
          BRANCH: ${{ inputs.branch }}
          DEPLOY_TARGET: ${{ inputs.environment }}
          DEPLOY_TASK: ${{ inputs.service }}
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
          STAG_CONFIG: ${{ vars.STAG_CONFIG }}
          STAG_SERVER_PASS: ${{ secrets.STAG_SERVER_PASS }}
          STAG_SERVER_KEY: ${{ secrets.STAG_SERVER_KEY }}
          STAG_B64ENC_ENVS: ${{ secrets.STAG_B64ENC_ENVS }}
          STAG_B64ENC_ACME: ${{ secrets.STAG_B64ENC_ACME }}
          PROD_CONFIG: ${{ vars.PROD_CONFIG }}
          PROD_SERVER_PASS: ${{ secrets.PROD_SERVER_PASS }}
          PROD_SERVER_KEY: ${{ secrets.PROD_SERVER_KEY }}
          PROD_B64ENC_ENVS: ${{ secrets.PROD_B64ENC_ENVS }}
          PROD_B64ENC_ACME: ${{ secrets.PROD_B64ENC_ACME }}
