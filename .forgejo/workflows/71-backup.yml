name: Backup

on:
  schedule:
    - cron: '30 2 * * *'
      timezone: Australia/Sydney
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - stag
          - prod
      backup:
        description: 'auto: scheduled cadence (DB every 3rd day, full every 10th day, config every run); db: DB/config now; full: full/config now'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - db
          - full

# Static group: the ssh-deploy runner has capacity 1, so environment runs
# serialise at the runner anyway and the expression support for inputs in
# concurrency groups is not verified for our Forgejo version.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ssh-deploy
    steps:
      - name: Create and replicate protected backups
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "Error: $*" >&2
            exit 1
          }

          [ -n "${DEPLOY_TARGET:-}" ] || DEPLOY_TARGET=prod
          DEPLOY_TARGET=$(printf '%s' "$DEPLOY_TARGET" | tr '[:upper:]' '[:lower:]')

          case "$DEPLOY_TARGET" in
            stag) PREFIX=STAG ;;
            prod) PREFIX=PROD ;;
            *) fail "unknown DEPLOY_TARGET '$DEPLOY_TARGET' (expected stag or prod)" ;;
          esac

          [ -n "${BACKUP_MODE:-}" ] || BACKUP_MODE=auto
          case "$BACKUP_MODE" in
            auto) RUN_DB=auto; RUN_FULL=auto ;;
            db) RUN_DB=1; RUN_FULL=0 ;;
            full) RUN_DB=0; RUN_FULL=1 ;;
            *) fail "unknown backup mode '$BACKUP_MODE' (expected auto, db or full)" ;;
          esac

          get() { eval "printf '%s' \"\${$1:-}\""; }

          # Connection and backup settings live in one JSON variable per
          # environment (see README, ${PREFIX}_CONFIG); credentials and the
          # Home Server transfer material stay as individual secrets.
          CONFIG_JSON=$(get "${PREFIX}_CONFIG")
          SERVER_PASSWORD=$(get "${PREFIX}_SERVER_PASS")
          SERVER_KEY=$(get "${PREFIX}_SERVER_KEY")
          HOME_SSH_KEY=$(get "BACKUP_HOME_SSH_KEY")
          HOME_SSH_KNOWN_HOSTS=$(get "BACKUP_HOME_SSH_KNOWN_HOSTS")
          RCLONE_CONFIG_VALUE=$(get "BACKUP_RCLONE_CONFIG")

          [ -n "$CONFIG_JSON" ] || fail "${PREFIX}_CONFIG is not set"
          command -v jq >/dev/null 2>&1 || fail "required command 'jq' not found (runner image)"
          cfg() {
            printf '%s' "$CONFIG_JSON" | jq -r --arg k "$1" \
              'if (.[$k] | type) == "string" then .[$k]
               elif (.[$k] | type) == "number" then (.[$k] | tostring)
               else empty end' ||
              fail "${PREFIX}_CONFIG is not valid JSON"
          }

          SERVER_HOST=$(cfg server_host)
          SERVER_USER=$(cfg server_user)
          SERVER_PORT=$(cfg server_port)
          DEPLOY_PATH=$(cfg deploy_path)
          BACKUP_ROOT=$(cfg backup_root)
          BACKUP_EXCLUDE=$(cfg backup_exclude)
          DB_RETENTION_DAYS=$(cfg db_backup_retention_days)
          FULL_RETENTION_DAYS=$(cfg backup_local_full_retention_days)
          SSH_KNOWN_HOST=$(cfg server_ssh_known_hosts)
          HOME_SFTP=$(cfg backup_home_sftp)
          HOME_DESTINATION=$(cfg backup_home_destination)
          HOME_DB_KEEP_AGE=$(cfg backup_home_db_keep_age)
          HOME_FULL_KEEP_AGE=$(cfg backup_home_full_keep_age)
          RCLONE_DESTINATION=$(cfg backup_rclone_destination)
          RCLONE_DB_KEEP_AGE=$(cfg backup_rclone_db_keep_age)
          RCLONE_FULL_KEEP_AGE=$(cfg backup_rclone_full_keep_age)

          [ -n "$SERVER_HOST" ] || fail "${PREFIX}_CONFIG.server_host is not set"
          case "$SERVER_HOST" in
            *[!A-Za-z0-9._-]*) fail "${PREFIX}_CONFIG.server_host contains unsupported characters" ;;
          esac
          [ -n "$SERVER_USER" ] || fail "${PREFIX}_CONFIG.server_user is not set"
          case "$SERVER_USER" in
            *[!A-Za-z0-9._-]*) fail "${PREFIX}_CONFIG.server_user contains unsupported characters" ;;
          esac
          [ -n "$SSH_KNOWN_HOST" ] || fail "${PREFIX}_CONFIG.server_ssh_known_hosts is not set"
          [ -n "$SERVER_PORT" ] || SERVER_PORT=22
          case "$SERVER_PORT" in
            *[!0-9]*) fail "${PREFIX}_CONFIG.server_port must be a port number" ;;
          esac
          if [ "${#SERVER_PORT}" -gt 5 ] || [ "$SERVER_PORT" -lt 1 ] || [ "$SERVER_PORT" -gt 65535 ]; then
            fail "${PREFIX}_CONFIG.server_port must be between 1 and 65535"
          fi
          if [ -z "$SERVER_PASSWORD" ] && [ -z "$SERVER_KEY" ]; then
            fail "${PREFIX}_SERVER_PASS or ${PREFIX}_SERVER_KEY must be set"
          fi
          [ -n "$DEPLOY_PATH" ] || fail "${PREFIX}_CONFIG.deploy_path is not set"
          [ -n "$BACKUP_ROOT" ] || fail "${PREFIX}_CONFIG.backup_root is not set"
          [ -n "$DB_RETENTION_DAYS" ] || fail "${PREFIX}_CONFIG.db_backup_retention_days is not set"
          [ -n "$FULL_RETENTION_DAYS" ] || fail "${PREFIX}_CONFIG.backup_local_full_retention_days is not set"

          # Each off-host target is enabled by its own destination key. Leaving
          # a key empty disables that target and every setting and secret that
          # only it uses. Same-host archives under backup_root are always made.
          if [ -n "$HOME_DESTINATION" ]; then
            ENABLE_HOME=1
            [ -n "$HOME_SFTP" ] || fail "${PREFIX}_CONFIG.backup_home_sftp is not set"
            [ -n "$HOME_SSH_KEY" ] || fail "BACKUP_HOME_SSH_KEY is not set"
            [ -n "$HOME_SSH_KNOWN_HOSTS" ] || fail "BACKUP_HOME_SSH_KNOWN_HOSTS is not set"
            [ -n "$HOME_DB_KEEP_AGE" ] || fail "${PREFIX}_CONFIG.backup_home_db_keep_age is not set"
            [ -n "$HOME_FULL_KEEP_AGE" ] || fail "${PREFIX}_CONFIG.backup_home_full_keep_age is not set"
          else
            ENABLE_HOME=0
          fi
          if [ -n "$RCLONE_DESTINATION" ]; then
            ENABLE_GDRIVE=1
            [ -n "$RCLONE_CONFIG_VALUE" ] || fail "BACKUP_RCLONE_CONFIG is not set"
            [ -n "$RCLONE_DB_KEEP_AGE" ] || fail "${PREFIX}_CONFIG.backup_rclone_db_keep_age is not set"
            [ -n "$RCLONE_FULL_KEEP_AGE" ] || fail "${PREFIX}_CONFIG.backup_rclone_full_keep_age is not set"
          else
            ENABLE_GDRIVE=0
          fi
          if [ "$ENABLE_HOME" = 0 ] && [ "$ENABLE_GDRIVE" = 0 ]; then
            fail "no off-host target is enabled: set ${PREFIX}_CONFIG.backup_home_destination, ${PREFIX}_CONFIG.backup_rclone_destination, or both"
          fi
          echo "Enabled off-host targets: home=$ENABLE_HOME gdrive=$ENABLE_GDRIVE"

          validate_rclone_age() {
            local age_name=$1
            local age_value=$2
            case "$age_value" in
              -*) fail "$age_name must not start with a dash" ;;
            esac
            # Deliberately stricter than Rclone's grammar: a single simple
            # duration with an optional fractional part (30d, 12w, 6M, 1.5d).
            # Rejects partial or malformed values such as '.', '30dd', 'd'
            # and '1d2h' instead of deferring to Rclone at deletion time.
            if [[ ! "$age_value" =~ ^[0-9]+([.][0-9]+)?(s|m|h|d|w|M|y)$ ]]; then
              fail "$age_name must be an Rclone duration such as 30d, 12w, 6M, or 1y"
            fi
          }

          case "$DB_RETENTION_DAYS" in
            ''|*[!0-9]*) fail "${PREFIX}_CONFIG.db_backup_retention_days must be a number of days" ;;
          esac
          case "$FULL_RETENTION_DAYS" in
            ''|*[!0-9]*) fail "${PREFIX}_CONFIG.backup_local_full_retention_days must be a number of days" ;;
          esac
          case "$DEPLOY_PATH" in
            /*) ;;
            *) fail "${PREFIX}_CONFIG.deploy_path must be an absolute path" ;;
          esac
          case "$BACKUP_ROOT" in
            /*) ;;
            *) fail "${PREFIX}_CONFIG.backup_root must be an absolute path" ;;
          esac
          case "$DEPLOY_PATH" in
            *[!A-Za-z0-9._/-]*) fail "${PREFIX}_CONFIG.deploy_path contains unsupported characters" ;;
          esac
          case "$BACKUP_ROOT" in
            *[!A-Za-z0-9._/-]*) fail "${PREFIX}_CONFIG.backup_root contains unsupported characters" ;;
          esac
          if [ "$ENABLE_HOME" = 1 ]; then
            case "$HOME_SFTP" in
              *@?*) ;;
              *) fail "${PREFIX}_CONFIG.backup_home_sftp must have the form user@host or user@host:port" ;;
            esac
            HOME_SFTP_USER=${HOME_SFTP%%@*}
            HOME_SFTP_ADDR=${HOME_SFTP#*@}
            case "$HOME_SFTP_ADDR" in
              *:*) HOME_SFTP_HOST=${HOME_SFTP_ADDR%%:*}; HOME_SFTP_PORT=${HOME_SFTP_ADDR##*:} ;;
              *) HOME_SFTP_HOST=$HOME_SFTP_ADDR; HOME_SFTP_PORT=22 ;;
            esac
            if [ -z "$HOME_SFTP_USER" ] || [ -z "$HOME_SFTP_HOST" ]; then
              fail "${PREFIX}_CONFIG.backup_home_sftp must have the form user@host or user@host:port"
            fi
            case "$HOME_SFTP_PORT" in
              ''|*[!0-9]*) fail "${PREFIX}_CONFIG.backup_home_sftp port must be a number" ;;
            esac
            if [ "${#HOME_SFTP_PORT}" -gt 5 ] || [ "$HOME_SFTP_PORT" -lt 1 ] || [ "$HOME_SFTP_PORT" -gt 65535 ]; then
              fail "${PREFIX}_CONFIG.backup_home_sftp port must be between 1 and 65535"
            fi
            case "$HOME_DESTINATION" in
              /*) ;;
              *) fail "${PREFIX}_CONFIG.backup_home_destination must be an absolute path on the Home Server" ;;
            esac
            case "$HOME_DESTINATION$HOME_SFTP" in
              *[!A-Za-z0-9._/@:-]*) fail "${PREFIX}_CONFIG.backup_home settings contain unsupported characters" ;;
            esac
            validate_rclone_age "${PREFIX}_CONFIG.backup_home_db_keep_age" "$HOME_DB_KEEP_AGE"
            validate_rclone_age "${PREFIX}_CONFIG.backup_home_full_keep_age" "$HOME_FULL_KEEP_AGE"
          fi
          if [ "$ENABLE_GDRIVE" = 1 ]; then
            case "$RCLONE_DESTINATION" in
              *:*) ;;
              *) fail "${PREFIX}_CONFIG.backup_rclone_destination must include a configured remote" ;;
            esac
            validate_rclone_age "${PREFIX}_CONFIG.backup_rclone_db_keep_age" "$RCLONE_DB_KEEP_AGE"
            validate_rclone_age "${PREFIX}_CONFIG.backup_rclone_full_keep_age" "$RCLONE_FULL_KEEP_AGE"
          fi

          EXCLUDE_ARGS=
          if [ -n "$BACKUP_EXCLUDE" ]; then
            for entry in $(printf '%s' "$BACKUP_EXCLUDE" | tr ',' ' '); do
              case "$entry" in
                *[!A-Za-z0-9._/*?-]*) fail "invalid character in ${PREFIX}_CONFIG.backup_exclude entry '$entry'" ;;
              esac
              entry=${entry#./}
              entry=${entry#/}
              EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude='./$entry'"
            done
            echo "Excluding from the archive: $BACKUP_EXCLUDE"
          fi

          # PostgreSQL runs inside the remote infrapgsql container, so the
          # runner only needs the SSH client and jq.
          for command in ssh jq; do
            command -v "$command" >/dev/null 2>&1 || fail "required command '$command' not found"
          done
          if [ "$ENABLE_HOME" = 1 ] || [ "$ENABLE_GDRIVE" = 1 ]; then
            command -v rclone >/dev/null 2>&1 || fail "required command 'rclone' not found"
          fi
          if [ -z "$SERVER_KEY" ]; then
            command -v sshpass >/dev/null 2>&1 || fail "required command 'sshpass' not found for password authentication"
          fi

          SSH_KEY_FILE=
          KNOWN_HOSTS_FILE=
          HOME_KEY_FILE=
          HOME_KNOWN_HOSTS_FILE=
          RCLONE_CONFIG_FILE=
          BACKUP_LOG=
          cleanup() {
            [ -z "$SSH_KEY_FILE" ] || rm -f "$SSH_KEY_FILE"
            [ -z "$KNOWN_HOSTS_FILE" ] || rm -f "$KNOWN_HOSTS_FILE"
            [ -z "$HOME_KEY_FILE" ] || rm -f "$HOME_KEY_FILE"
            [ -z "$HOME_KNOWN_HOSTS_FILE" ] || rm -f "$HOME_KNOWN_HOSTS_FILE"
            [ -z "$RCLONE_CONFIG_FILE" ] || rm -f "$RCLONE_CONFIG_FILE"
            [ -z "$BACKUP_LOG" ] || rm -f "$BACKUP_LOG"
          }
          trap cleanup EXIT

          if [ -n "$SERVER_KEY" ]; then
            SSH_KEY_FILE=$(mktemp)
            chmod 600 "$SSH_KEY_FILE"
            printf '%s\n' "$SERVER_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          fi
          KNOWN_HOSTS_FILE=$(mktemp)
          chmod 600 "$KNOWN_HOSTS_FILE"
          printf '%s\n' "$SSH_KNOWN_HOST" | tr -d '\r' > "$KNOWN_HOSTS_FILE"
          [ -s "$KNOWN_HOSTS_FILE" ] || fail "no SSH host keys for $SERVER_HOST (set ${PREFIX}_CONFIG.server_ssh_known_hosts)"

          ssh_exec() {
            if [ -n "$SERVER_KEY" ]; then
              ssh -p "$SERVER_PORT" -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" "$SERVER_USER@$SERVER_HOST" "$@"
            else
              SSHPASS="$SERVER_PASSWORD" sshpass -e ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" "$SERVER_USER@$SERVER_HOST" "$@"
            fi
          }

          echo "Creating protected backups for $DEPLOY_TARGET"

          BACKUP_LOG=$(mktemp)
          ssh_exec "set -e
          DB_STAGE=
          CFG_STAGE=
          TMP=
          remote_cleanup() {
            [ -z \"\$TMP\" ] || rm -f \"\$TMP\"
            [ -z \"\$DB_STAGE\" ] || rm -rf \"\$DB_STAGE\"
            [ -z \"\$CFG_STAGE\" ] || rm -rf \"\$CFG_STAGE\"
          }
          trap remote_cleanup EXIT

          APPS_DATA=\$(grep -E '^APPS_DATA=' '$DEPLOY_PATH/.env' 2>/dev/null | tail -1 | cut -d '=' -f2- | tr -d '\"')
          APPS_DATA=\$(printf '%s' \"\$APPS_DATA\" | sed \"s|^~|\$HOME|\")
          [ -n \"\$APPS_DATA\" ] || { echo 'Error: APPS_DATA is not set in the deployment environment' >&2; exit 1; }
          SRC=\"\$APPS_DATA\"
          [ -d \"\$SRC\" ] || { echo 'Error: the persistent-data source directory does not exist' >&2; exit 1; }

          DOMAIN_NAME=\$(grep -E '^DOMAIN_NAME=' '$DEPLOY_PATH/.env' 2>/dev/null | tail -1 | cut -d '=' -f2- | tr -d '\"')
          DOMAIN_NAME=\${DOMAIN_NAME%%.*}
          [ -n \"\$DOMAIN_NAME\" ] || { echo 'Error: DOMAIN_NAME is not set in $DEPLOY_PATH/.env' >&2; exit 1; }

          STAMP=\$(date +%Y%m%d)
          DST='$BACKUP_ROOT'/\$(date +%Y)/\$(date +%Y%m)
          CREATED_ARCHIVES=

          sudo -n mkdir -p \"\$DST\"

          cd '$DEPLOY_PATH'
          if command -v docker-compose >/dev/null 2>&1; then COMPOSE='docker-compose'; else COMPOSE='docker compose'; fi

          # Cadence for the scheduled (auto) mode: an epoch-day index gives
          # exact intervals across months — database every 3 days, full every
          # 10 days (both fall due on the same run every 30 days). Evaluated
          # on the source server clock; the configuration archive below is
          # created on every run regardless.
          DAY_INDEX=\$(( \$(date +%s) / 86400 ))
          RUN_DB_NOW='$RUN_DB'
          if [ \"\$RUN_DB_NOW\" = auto ]; then
            if [ \$(( \$DAY_INDEX % 3 )) -eq 0 ]; then RUN_DB_NOW=1; else RUN_DB_NOW=0; fi
          fi

          if [ \"\$RUN_DB_NOW\" = 1 ]; then
            DB_ADMIN_USER=\$(grep -E '^DB_ADMIN_USER=' .env 2>/dev/null | tail -1 | cut -d '=' -f2- | tr -d '\"')
            [ -n \"\$DB_ADMIN_USER\" ] || DB_ADMIN_USER=postgres

            DB_LIST=\$(\$COMPOSE exec -T infrapgsql psql -U \"\$DB_ADMIN_USER\" -d postgres -Atc \"SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres' ORDER BY datname\")
            [ -n \"\$DB_LIST\" ] || { echo 'Error: no non-template databases found' >&2; exit 1; }

            DB_STAGE=\$(mktemp -d)

            for db in \$DB_LIST; do
              case \"\$db\" in
                *[!A-Za-z0-9_]*) echo \"Error: unexpected database name '\$db'\" >&2; exit 1 ;;
              esac
              NAME=\"\$DOMAIN_NAME-dbBK-\$db-\$STAMP.dump\"
              TMP=\$(mktemp)
              echo \"Dumping database \$db -> stage:\$NAME\"
              \$COMPOSE exec -T infrapgsql pg_dump -U \"\$DB_ADMIN_USER\" -Fc \"\$db\" > \"\$TMP\"
              [ -s \"\$TMP\" ] || { rm -f \"\$TMP\"; echo \"Error: dump of \$db is empty\" >&2; exit 1; }
              install -m 600 \"\$TMP\" \"\$DB_STAGE/\$NAME\"
              rm -f \"\$TMP\"
              TMP=
            done

            NAME=\"\$DOMAIN_NAME-dbBK-globals-\$STAMP.sql\"
            TMP=\$(mktemp)
            echo \"Dumping role globals -> stage:\$NAME\"
            \$COMPOSE exec -T infrapgsql pg_dumpall -U \"\$DB_ADMIN_USER\" --globals-only > \"\$TMP\"
            [ -s \"\$TMP\" ] || { rm -f \"\$TMP\"; echo 'Error: globals dump is empty' >&2; exit 1; }
            install -m 600 \"\$TMP\" \"\$DB_STAGE/\$NAME\"
            rm -f \"\$TMP\"
            TMP=

            ARCHIVE=\"\$DST/\$DOMAIN_NAME-webapps-dbBK-\$STAMP.tar.gz\"
            echo \"Archiving database dumps -> \$ARCHIVE\"
            set +e
            sudo -n tar -czf \"\$ARCHIVE.part\" -C \"\$DB_STAGE\" .
            rc=\$?
            set -e
            # Static stage: any nonzero tar status (including 1) is fatal.
            if [ \"\$rc\" -ne 0 ]; then
              echo \"Error: tar exited \$rc\" >&2
              sudo -n rm -f \"\$ARCHIVE.part\"
              exit \"\$rc\"
            fi
            [ -s \"\$ARCHIVE.part\" ] || { echo 'Error: db archive is empty' >&2; exit 1; }
            sudo -n mv -f \"\$ARCHIVE.part\" \"\$ARCHIVE\"
            sudo -n chmod 600 \"\$ARCHIVE\"
            # The transfer steps below read the archive as the SSH user, not root.
            sudo -n chown \"\$(id -u):\$(id -g)\" \"\$ARCHIVE\"
            rm -rf \"\$DB_STAGE\"
            DB_STAGE=
            CREATED_ARCHIVES=\"\$CREATED_ARCHIVES \$ARCHIVE\"
            echo \"Database backup complete: \$(basename \"\$ARCHIVE\")\"

            echo \"Pruning database backups older than $DB_RETENTION_DAYS days\"
            sudo -n find '$BACKUP_ROOT' -type f -name '*-dbBK-*' -mtime +$DB_RETENTION_DAYS -print -delete
            sudo -n find '$BACKUP_ROOT' -mindepth 2 -type d -empty -path '*/[0-9][0-9][0-9][0-9]/[0-9][0-9][0-9][0-9][0-9][0-9]' -delete
          fi

          # Runtime configuration: .env lives in the deploy path and is not
          # included in the full application-data source. The egress policy
          # file lives under APPS_DATA/shared/gateway and may also be present
          # in the full archive. Archive both in cfgBK on every run so
          # a loss costs at most one day of configuration changes.
          CFG_STAGE=\$(mktemp -d)
          install -d -m 700 \"\$CFG_STAGE\"
          sudo -n install -m 600 '$DEPLOY_PATH'/.env \"\$CFG_STAGE/.env\"
          sudo -n install -m 600 \"\$APPS_DATA\"/shared/gateway/egress-policies.conf \"\$CFG_STAGE/egress-policies.conf\" 2>/dev/null || echo \"Skipping egress-policies.conf (not present)\"
          ARCHIVE=\"\$DST/\$DOMAIN_NAME-cfgBK-\$STAMP.tar.gz\"
          echo \"Archiving runtime configuration -> \$ARCHIVE\"
          set +e
          sudo -n tar -czf \"\$ARCHIVE.part\" -C \"\$CFG_STAGE\" .
          rc=\$?
          set -e
          # Static stage: any nonzero tar status (including 1) is fatal.
          if [ \"\$rc\" -ne 0 ]; then
            echo \"Error: tar exited \$rc\" >&2
            sudo -n rm -f \"\$ARCHIVE.part\"
            exit \"\$rc\"
          fi
          [ -s \"\$ARCHIVE.part\" ] || { echo 'Error: config archive is empty' >&2; exit 1; }
          sudo -n mv -f \"\$ARCHIVE.part\" \"\$ARCHIVE\"
          sudo -n chmod 600 \"\$ARCHIVE\"
          # The transfer steps below read the archive as the SSH user, not root.
          sudo -n chown \"\$(id -u):\$(id -g)\" \"\$ARCHIVE\"
          rm -rf \"\$CFG_STAGE\"
          CFG_STAGE=
          CREATED_ARCHIVES=\"\$CREATED_ARCHIVES \$ARCHIVE\"
          echo \"Configuration backup complete: \$(basename \"\$ARCHIVE\")\"
          echo \"Pruning configuration backups older than $DB_RETENTION_DAYS days\"
          sudo -n find '$BACKUP_ROOT' -type f -name '*-cfgBK-*' -mtime +$DB_RETENTION_DAYS -print -delete
          sudo -n find '$BACKUP_ROOT' -mindepth 2 -type d -empty -path '*/[0-9][0-9][0-9][0-9]/[0-9][0-9][0-9][0-9][0-9][0-9]' -delete

          RUN_FULL_NOW='$RUN_FULL'
          if [ \"\$RUN_FULL_NOW\" = auto ]; then
            if [ \$(( \$DAY_INDEX % 10 )) -eq 0 ]; then RUN_FULL_NOW=1; else RUN_FULL_NOW=0; fi
          fi
          if [ \"\$RUN_FULL_NOW\" = 1 ]; then
            ARCHIVE=\"\$DST/\$DOMAIN_NAME-webapps-fullBK-\$STAMP.tar.gz\"
            echo \"Archiving \$SRC -> \$ARCHIVE\"
            set +e
            sudo -n tar -czf \"\$ARCHIVE.part\"$EXCLUDE_ARGS -C \"\$SRC\" .
            rc=\$?
            set -e
            if [ \"\$rc\" -eq 1 ]; then
              # Live application data: tar exits 1 when files change while
              # being read. The archive is still useful; warn explicitly.
              echo \"WARNING: tar reported files changed while being archived; the full archive may be inconsistent\" >&2
            elif [ \"\$rc\" -gt 1 ]; then
              echo \"Error: tar exited \$rc\" >&2
              sudo -n rm -f \"\$ARCHIVE.part\"
              exit \"\$rc\"
            fi
            [ -s \"\$ARCHIVE.part\" ] || { echo 'Error: archive is empty' >&2; exit 1; }
            sudo -n mv -f \"\$ARCHIVE.part\" \"\$ARCHIVE\"
            sudo -n chmod 600 \"\$ARCHIVE\"
            # The transfer steps below read the archive as the SSH user, not root.
            sudo -n chown \"\$(id -u):\$(id -g)\" \"\$ARCHIVE\"
            CREATED_ARCHIVES=\"\$CREATED_ARCHIVES \$ARCHIVE\"
            echo \"Backup complete: \$(basename \"\$ARCHIVE\")\"
          fi

          echo \"Pruning full archives older than $FULL_RETENTION_DAYS days\"
          sudo -n find '$BACKUP_ROOT' -type f -name '*-fullBK-*' -mtime +$FULL_RETENTION_DAYS -print -delete
          sudo -n find '$BACKUP_ROOT' -mindepth 2 -type d -empty -path '*/[0-9][0-9][0-9][0-9]/[0-9][0-9][0-9][0-9][0-9][0-9]' -delete

          for CREATED_ARCHIVE in \$CREATED_ARCHIVES; do
            printf 'BACKUP_ARTIFACT=%s\n' \"\$CREATED_ARCHIVE\"
          done
          echo 'backup ($DEPLOY_TARGET) creation completed'" | tee "$BACKUP_LOG" | sed '/^BACKUP_ARTIFACT=/d'

          ARTIFACTS=()
          while IFS= read -r line; do
            case "$line" in
              BACKUP_ARTIFACT=*) ARTIFACTS+=("${line#BACKUP_ARTIFACT=}") ;;
            esac
          done < "$BACKUP_LOG"
          [ "${#ARTIFACTS[@]}" -gt 0 ] || fail "no protected backup artifact was created"

          for artifact in "${ARTIFACTS[@]}"; do
            case "$artifact" in
              "$BACKUP_ROOT"/*-dbBK-*.tar.gz|"$BACKUP_ROOT"/*-fullBK-*.tar.gz|"$BACKUP_ROOT"/*-cfgBK-*.tar.gz) ;;
              *) fail "workflow returned an unexpected backup artifact path" ;;
            esac
          done

          # Reserved remote names: the supplied configuration may itself
          # contain remotes named servicehub-*, so never reuse those.
          RCLONE_SOURCE_REMOTE=_workflow_source
          RCLONE_HOME_REMOTE=_workflow_home

          if [ "$ENABLE_HOME" = 1 ] || [ "$ENABLE_GDRIVE" = 1 ]; then
            RCLONE_CONFIG_FILE=$(mktemp)
            chmod 600 "$RCLONE_CONFIG_FILE"
            if [ -n "$RCLONE_CONFIG_VALUE" ]; then
              printf '%s\n' "$RCLONE_CONFIG_VALUE" | tr -d '\r' > "$RCLONE_CONFIG_FILE"
            fi
            RCLONE_SOURCE_AUTH=()
            if [ -n "$SERVER_KEY" ]; then
              RCLONE_SOURCE_AUTH=(key_file "$SSH_KEY_FILE")
            else
              RCLONE_SOURCE_AUTH=(pass "$SERVER_PASSWORD")
            fi
            rclone --config "$RCLONE_CONFIG_FILE" config create "$RCLONE_SOURCE_REMOTE" sftp \
              host "$SERVER_HOST" \
              port "$SERVER_PORT" \
              user "$SERVER_USER" \
              known_hosts_file "$KNOWN_HOSTS_FILE" \
              "${RCLONE_SOURCE_AUTH[@]}" \
              --obscure
          fi

          if [ "$ENABLE_HOME" = 1 ]; then
            HOME_KEY_FILE=$(mktemp)
            HOME_KNOWN_HOSTS_FILE=$(mktemp)
            chmod 600 "$HOME_KEY_FILE" "$HOME_KNOWN_HOSTS_FILE"
            printf '%s\n' "$HOME_SSH_KEY" | tr -d '\r' > "$HOME_KEY_FILE"
            printf '%s\n' "$HOME_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME_KNOWN_HOSTS_FILE"
            [ -s "$HOME_KNOWN_HOSTS_FILE" ] || fail "BACKUP_HOME_SSH_KNOWN_HOSTS did not produce a usable known_hosts file"
            rclone --config "$RCLONE_CONFIG_FILE" config create "$RCLONE_HOME_REMOTE" sftp \
              host "$HOME_SFTP_HOST" \
              port "$HOME_SFTP_PORT" \
              user "$HOME_SFTP_USER" \
              key_file "$HOME_KEY_FILE" \
              known_hosts_file "$HOME_KNOWN_HOSTS_FILE" \
              --obscure
            echo "Testing Home Server Rclone access"
            rclone --config "$RCLONE_CONFIG_FILE" mkdir "${RCLONE_HOME_REMOTE}:$HOME_DESTINATION"
            rclone --config "$RCLONE_CONFIG_FILE" lsd "${RCLONE_HOME_REMOTE}:$HOME_DESTINATION" >/dev/null
          fi

          if [ "$ENABLE_GDRIVE" = 1 ]; then
            RCLONE_DEST_REMOTE=${RCLONE_DESTINATION%%:*}
            RCLONE_REMOTE_TYPE=$(
              rclone --config "$RCLONE_CONFIG_FILE" config dump |
                jq -r --arg remote "$RCLONE_DEST_REMOTE" '(.remotes // .)[$remote].type // empty'
            )
            [ -n "$RCLONE_REMOTE_TYPE" ] || fail "the configured Rclone destination remote '$RCLONE_DEST_REMOTE' is not present"
            [ "$RCLONE_REMOTE_TYPE" = "crypt" ] || fail "${PREFIX}_CONFIG.backup_rclone_destination must use an Rclone Crypt remote (remote '$RCLONE_DEST_REMOTE' has type '$RCLONE_REMOTE_TYPE')"
          fi

          # Copy semantics only: new archives are added and verified, source
          # deletions never propagate, and retention is applied explicitly on
          # each destination after every transfer.
          replicate_to() {
            local replicate_base=$1
            local replicate_db_keep_age=$2
            local replicate_full_keep_age=$3
            local artifact relative_artifact destination
            for artifact in "${ARTIFACTS[@]}"; do
              relative_artifact="${artifact#"$BACKUP_ROOT"/}"
              destination="${replicate_base%/}/$relative_artifact"
              rclone --config "$RCLONE_CONFIG_FILE" copyto "${RCLONE_SOURCE_REMOTE}:$artifact" "$destination" --retries 3 --low-level-retries 3
              # rclone check requires directory trees; verify a single file
              # by comparing SHA256 from both ends instead.
              src_hash=$(rclone --config "$RCLONE_CONFIG_FILE" hashsum sha256 --download "${RCLONE_SOURCE_REMOTE}:$artifact" 2>/dev/null | awk 'NR==1{print $1}')
              dst_hash=$(rclone --config "$RCLONE_CONFIG_FILE" hashsum sha256 --download "$destination" 2>/dev/null | awk 'NR==1{print $1}')
              [ -n "$src_hash" ] && [ "$src_hash" = "$dst_hash" ] || fail "checksum mismatch after copy: $destination"
            done

            rclone --config "$RCLONE_CONFIG_FILE" delete "$replicate_base" \
              --min-age "$replicate_db_keep_age" \
              --include '*-dbBK-*' \
              --rmdirs
            rclone --config "$RCLONE_CONFIG_FILE" delete "$replicate_base" \
              --min-age "$replicate_full_keep_age" \
              --include '*-fullBK-*' \
              --rmdirs
            # Configuration archives are created on every run and share the
            # database-archive retention age, so they need no key of their own.
            rclone --config "$RCLONE_CONFIG_FILE" delete "$replicate_base" \
              --min-age "$replicate_db_keep_age" \
              --include '*-cfgBK-*' \
              --rmdirs
          }

          if [ "$ENABLE_HOME" = 1 ]; then
            echo "Transferring protected backups to the Home Server"
            replicate_to "${RCLONE_HOME_REMOTE}:$HOME_DESTINATION" "$HOME_DB_KEEP_AGE" "$HOME_FULL_KEEP_AGE"
          fi

          if [ "$ENABLE_GDRIVE" = 1 ]; then
            echo "Transferring protected backups to Google Drive"
            replicate_to "$RCLONE_DESTINATION" "$RCLONE_DB_KEEP_AGE" "$RCLONE_FULL_KEEP_AGE"
          fi

          echo "backup ($DEPLOY_TARGET) completed for ${#ARTIFACTS[@]} artifact(s)"
        env:
          DEPLOY_TARGET: ${{ inputs.environment }}
          BACKUP_MODE: ${{ inputs.backup }}
          BACKUP_HOME_SSH_KEY: ${{ secrets.BACKUP_HOME_SSH_KEY }}
          BACKUP_HOME_SSH_KNOWN_HOSTS: ${{ secrets.BACKUP_HOME_SSH_KNOWN_HOSTS }}
          BACKUP_RCLONE_CONFIG: ${{ secrets.BACKUP_RCLONE_CONFIG }}
          STAG_CONFIG: ${{ vars.STAG_CONFIG }}
          STAG_SERVER_PASS: ${{ secrets.STAG_SERVER_PASS }}
          STAG_SERVER_KEY: ${{ secrets.STAG_SERVER_KEY }}
          PROD_CONFIG: ${{ vars.PROD_CONFIG }}
          PROD_SERVER_PASS: ${{ secrets.PROD_SERVER_PASS }}
          PROD_SERVER_KEY: ${{ secrets.PROD_SERVER_KEY }}
