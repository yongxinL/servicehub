# Forgejo Actions deployment workflow for ServiceHub.
#
# Deploys this repository to a remote Docker server over SSH. The runner checks
# out the selected branch, decrypts git-crypt files in the checkout, and syncs
# the working tree to the target with rsync — the target never receives git
# metadata (.git, .git-crypt, .gitignore, .gitattributes) or repository-only
# files (.forgejo/, AGENTS.md, docs/), and needs neither git nor git-crypt.
#
# Triggers:
#   - workflow_dispatch (Run workflow button in the Forgejo UI, or the
#     POST /repos/{owner}/{repo}/actions/workflows/61-deploy.yml/dispatches API)
#
# Inputs (same as the previous Gitea Actions workflow):
#   - service:     app service to deploy, or "all" (default). Foundational
#                  services (infra*, devops*, route*) are never deployed
#                  by CI. AI platform (aiserv*) and observability (obsvce*)
#                  services are outside the OCI deploy scope (ADR-009) and
#                  are not offered here.
#   - environment: deploy target, stag (default) or prod
#   - branch:      branch to deploy (default main)
#
# Secrets are read from the Forgejo repository secret store: see README.md
# (Repository -> Settings -> Actions -> Secrets).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      # Same inputs as the previous Gitea Actions workflow
      # (.gitea/workflows/deploy.yml at commit 60c3c0c): service dropdown,
      # environment and branch.
      # Foundational services (databases, Authentik, Forgejo + runner, Traefik)
      # are deliberately absent: they are deployed manually, and deploying
      # Forgejo would kill the runner mid-deploy. Traefik needs no restart —
      # its Docker provider discovers new containers via labels automatically.
      service:
        description: 'Service to deploy (or "all" app services)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - webappconf
          - webappocis
          - mailsvstalwart
          - mailsvbulwark
      environment:
        description: 'Target environment'
        required: true
        default: 'stag'
        type: choice
        options:
          - stag
          - prod
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

# Never run two deployments at once. Static group (not per-environment): the
# ssh-deploy runner has capacity 1, so stag/prod runs serialise at the runner
# anyway, and inputs-based expression evaluation in concurrency.group is not
# verified for our Forgejo version (same rationale as 71-backup.yml).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Host-mode runner: the job runs directly in the devopsrunner container,
    # which already ships git/openssh/sshpass (shared/forgejo/actions/Dockerfile).
    runs-on: ssh-deploy
    steps:
      - name: Checkout
        # Fully qualified URL so the action cannot be re-pointed by an
        # instance-wide DEFAULT_ACTIONS_URL change (Forgejo docs recommend
        # this). persist-credentials: false keeps the automatic GITHUB_TOKEN
        # out of .git/config, so it cannot leak into the rsync'd tree.
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Deploy
        # Bash explicitly: the script uses arrays and pipefail, so sh/dash
        # must never be selected as the step shell.
        shell: bash
        # Deploy logic lives here so the workflow is self-contained; inputs and
        # secrets are mapped to environment variables below.
        #
        #   DEPLOY_TARGET        stag|prod (default: stag)
        #   DEPLOY_TASK          app service name, or "all"/empty for the full
        #                        app allowlist (webappconf, webappocis,
        #                        mailsvstalwart, mailsvbulwark). Foundational
        #                        services (infra*, devops*, route*) are never
        #                        deployed here. Values outside the allowlist
        #                        fail before any SSH connection.
        #   BRANCH               branch to deploy (default: main; production
        #                        is restricted to main)
        #   GIT_CRYPT_KEY        base64-encoded git-crypt symmetric key,
        #                        required: unlock failure aborts the deploy
        #
        # SSH auth: set ${PREFIX}_SERVER_PASS (password) OR ${PREFIX}_SERVER_KEY
        # (private key, passwordless). If both are set the key takes precedence.
        # When using a key, the corresponding public key must already be in
        # ~/.ssh/authorized_keys on the target server. The target needs rsync.
        # ${PREFIX}_CONFIG must carry server_ssh_known_hosts (pinned host keys,
        # no ssh-keyscan fallback) and a non-default port via server_port.
        run: |
          set -euo pipefail

          fail() { echo "Error: $*" >&2; exit 1; }

          # --- resolve target and inputs ------------------------------------
          [ -n "${DEPLOY_TARGET:-}" ] || DEPLOY_TARGET=stag
          DEPLOY_TARGET=$(printf '%s' "$DEPLOY_TARGET" | tr '[:upper:]' '[:lower:]')
          [ -n "${DEPLOY_TASK:-}" ] || DEPLOY_TASK=all
          [ -n "${BRANCH:-}" ] || BRANCH=main
          [ -n "${GIT_CRYPT_KEY:-}" ] || GIT_CRYPT_KEY=

          case "$DEPLOY_TARGET" in
            stag) PREFIX=STAG ;;
            prod) PREFIX=PROD ;;
            *) fail "unknown DEPLOY_TARGET '$DEPLOY_TARGET' (expected stag or prod)" ;;
          esac

          # Production deploys only from main; stag can deploy any branch.
          if [ "$DEPLOY_TARGET" = prod ] && [ "$BRANCH" != main ]; then
            fail "production deploys only run from main (got branch '$BRANCH')"
          fi

          # Deployment task allowlist: must match the service input options
          # above. Keeps deployable services explicit instead of relying on
          # service-name prefixes (e.g. a new webapp* one-shot container).
          case "$DEPLOY_TASK" in
            all|webappconf|webappocis|mailsvstalwart|mailsvbulwark) ;;
            *) fail "unsupported deployment task '$DEPLOY_TASK'" ;;
          esac

          get() { eval "printf '%s' \"\${$1:-}\""; }

          # Connection and backup-independent settings live in one JSON
          # variable per environment (see README, ${PREFIX}_CONFIG). Credentials and the
          # large encoded blobs stay as individual secrets.
          CONFIG_JSON=$(get "${PREFIX}_CONFIG")
          SERVER_PASSWORD=$(get "${PREFIX}_SERVER_PASS")
          SERVER_KEY=$(get "${PREFIX}_SERVER_KEY")
          ENV_B64=$(get "${PREFIX}_B64ENC_ENVS")
          ACME_B64=$(get "${PREFIX}_B64ENC_ACME")

          [ -n "$CONFIG_JSON" ] || fail "${PREFIX}_CONFIG is not set"
          cfg() {
            printf '%s' "$CONFIG_JSON" | jq -r --arg k "$1" \
              'if (.[$k] | type) == "string" then .[$k]
               elif (.[$k] | type) == "number" then (.[$k] | tostring)
               else empty end' ||
              fail "${PREFIX}_CONFIG is not valid JSON"
          }

          SERVER_HOST=$(cfg server_host)
          SERVER_USER=$(cfg server_user)
          SERVER_PORT=$(cfg server_port)
          DEPLOY_PATH=$(cfg deploy_path)
          SSH_KNOWN_HOST=$(cfg server_ssh_known_hosts)

          # Host, user and path are interpolated into shell commands (local and
          # remote) and an rsync target, so reject anything outside a safe
          # character set before they reach a shell. deploy_path must be an
          # absolute path so remote `cd`/`rm -rf` cannot land relative to $HOME.
          [ -n "$SERVER_HOST" ] || fail "${PREFIX}_CONFIG.server_host is not set"
          # DNS/IPv4 only: an IPv6 literal cannot be used as user@host here,
          # and backup_home_sftp parses hosts the same way (71-backup.yml).
          printf '%s' "$SERVER_HOST" | grep -qE '^[A-Za-z0-9._-]+$' ||
            fail "${PREFIX}_CONFIG.server_host contains unsupported characters"
          [ -n "$SERVER_USER" ] || fail "${PREFIX}_CONFIG.server_user is not set"
          printf '%s' "$SERVER_USER" | grep -qE '^[A-Za-z0-9._-]+$' ||
            fail "${PREFIX}_CONFIG.server_user contains unsupported characters"
          [ -n "$DEPLOY_PATH" ] || fail "${PREFIX}_CONFIG.deploy_path is not set"
          case "$DEPLOY_PATH" in
            /*) ;;
            *) fail "${PREFIX}_CONFIG.deploy_path must be an absolute path" ;;
          esac
          printf '%s' "$DEPLOY_PATH" | grep -qE '^/[A-Za-z0-9._/-]+$' ||
            fail "${PREFIX}_CONFIG.deploy_path contains unsupported characters"
          [ -n "$SERVER_PORT" ] || SERVER_PORT=22
          case "$SERVER_PORT" in
            *[!0-9]*) fail "${PREFIX}_CONFIG.server_port must be a port number" ;;
          esac
          if [ "${#SERVER_PORT}" -gt 5 ] || [ "$SERVER_PORT" -lt 1 ] || [ "$SERVER_PORT" -gt 65535 ]; then
            fail "${PREFIX}_CONFIG.server_port must be between 1 and 65535"
          fi
          [ -n "$SSH_KNOWN_HOST" ] || fail "${PREFIX}_CONFIG.server_ssh_known_hosts is not set"
          [ -n "$SERVER_PASSWORD" ] || [ -n "$SERVER_KEY" ] ||
            fail "${PREFIX}_SERVER_PASS or ${PREFIX}_SERVER_KEY must be set"
          [ -n "$GIT_CRYPT_KEY" ] || fail "GIT_CRYPT_KEY is not set (git-crypt certificates cannot be decrypted)"

          for cmd in git git-crypt jq ssh rsync base64 gunzip mktemp; do
            command -v "$cmd" >/dev/null 2>&1 || fail "required command '$cmd' not found (runner image)"
          done
          if [ -z "$SERVER_KEY" ]; then
            command -v sshpass >/dev/null 2>&1 || fail "required command 'sshpass' not found (needed for password auth)"
          fi

          # When using key auth, materialize the private key into a temp file
          # with 0600 perms (ssh refuses more permissive key files). The trap
          # cleans up all temp files (SSH key, known hosts, git-crypt key) on
          # exit regardless of success or failure.
          SSH_KEY_FILE=
          GIT_CRYPT_KEY_FILE=
          GIT_CRYPT_UNLOCKED=0
          cleanup() {
            # Re-encrypt the checkout if it was unlocked: the runner is a
            # persistent host-mode container, so decrypted certificates must
            # not outlive the job. git crypt lock needs no key file (it uses
            # the cached key); failure is non-fatal.
            if [ "$GIT_CRYPT_UNLOCKED" = 1 ]; then
              git crypt lock >/dev/null 2>&1 || true
            fi
            rm -f ${SSH_KEY_FILE:+"$SSH_KEY_FILE"} "$KNOWN_HOSTS_FILE" ${GIT_CRYPT_KEY_FILE:+"$GIT_CRYPT_KEY_FILE"}
          }
          if [ -n "$SERVER_KEY" ]; then
            SSH_KEY_FILE=$(mktemp)
            chmod 600 "$SSH_KEY_FILE"
            # Strip CR so keys stored via the Forgejo HTTP API (CRLF) still parse.
            printf '%s\n' "$SERVER_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          fi
          KNOWN_HOSTS_FILE=$(mktemp)
          trap cleanup EXIT

          echo "Deploying '$DEPLOY_TASK' from branch '$BRANCH' to $DEPLOY_TARGET ($SERVER_USER@$SERVER_HOST:$DEPLOY_PATH)"

          # --- SSH host verification ----------------------------------------
          # ssh reads ~/.ssh/known_hosts via the passwd home, not $HOME: the
          # runner image runs as root but sets HOME=/data, so ~ resolves to
          # /data while ssh looks in /root. An explicit file keeps them in sync.
          # Pinned keys only — no ssh-keyscan fallback, so host trust never
          # depends on whatever answers the scan at run time.
          # Strip CR in case the value was pasted via the Forgejo HTTP API (CRLF).
          printf '%s\n' "$SSH_KNOWN_HOST" | tr -d '\r' >> "$KNOWN_HOSTS_FILE"
          [ -s "$KNOWN_HOSTS_FILE" ] || fail "no SSH host keys for $SERVER_HOST (set ${PREFIX}_CONFIG.server_ssh_known_hosts)"
          chmod 600 "$KNOWN_HOSTS_FILE"

          ssh_exec() {
            if [ -n "$SERVER_KEY" ]; then
              # BatchMode: never prompt (passphrase-protected keys fail fast
              # instead of hanging the job; use a passphrase-less key).
              ssh -p "$SERVER_PORT" -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" "$SERVER_USER@$SERVER_HOST" "$@"
            else
              SSHPASS="$SERVER_PASSWORD" sshpass -e ssh -p "$SERVER_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" "$SERVER_USER@$SERVER_HOST" "$@"
            fi
          }

          # --- decrypt git-crypt files in the runner checkout ----------------
          # Certificates under shared/traefik/advanced/selfsigncert/ are
          # encrypted at rest in the repository. The decrypted working tree is
          # what gets synced; the target never needs git or git-crypt. A wrong
          # or missing key aborts the deploy before anything is synced, so
          # encrypted (garbage) certificates can never reach the target.
          GIT_CRYPT_KEY_FILE=$(mktemp)
          chmod 600 "$GIT_CRYPT_KEY_FILE"
          printf '%s' "$GIT_CRYPT_KEY" | base64 -d > "$GIT_CRYPT_KEY_FILE" ||
            fail "GIT_CRYPT_KEY is not valid base64"
          git crypt unlock "$GIT_CRYPT_KEY_FILE" || fail "git-crypt unlock failed (check GIT_CRYPT_KEY)"
          GIT_CRYPT_UNLOCKED=1
          rm -f "$GIT_CRYPT_KEY_FILE"
          GIT_CRYPT_KEY_FILE=

          # --- sync the working tree (no git metadata on the target) ----------
          # Never transferred and removed from the target, so deployments made
          # by the old clone-based workflow migrate cleanly:
          #   .git .git-crypt .gitignore .gitattributes .forgejo AGENTS.md docs
          # Protected from --delete instead (restored or regenerated below):
          #   .env (bootstrap-only restore), admin-routers.yml and *.b64
          #   (regenerated by scripts/setup.sh).
          # Root-anchored patterns (/name) only match top-level entries; .env
          # and *.b64 stay unanchored so nested copies are protected too.
          # Array form so patterns stay literal (no word-splitting surprises).
          RSYNC_EXCLUDES=(
            --exclude=/.git --exclude=/.git-crypt --exclude=.env
            --exclude=/.gitignore --exclude=/.gitattributes --exclude=/.forgejo
            --exclude=/AGENTS.md --exclude=/docs
            --exclude=/shared/traefik/advanced/admin-routers.yml
            --exclude='*.b64'
          )

          ssh_exec "command -v rsync >/dev/null 2>&1 || { echo 'Error: rsync not installed on the target server' >&2; exit 1; }"
          ssh_exec "mkdir -p '$DEPLOY_PATH' && cd '$DEPLOY_PATH' &&
            rm -rf -- .git .git-crypt .gitignore .gitattributes .forgejo AGENTS.md docs"

          # If APPS_DATA resolves inside the deploy path, protect it from
          # --delete rather than trusting that it never will be. The remote
          # script prints a marked line so an ssh banner or MOTD on stdout
          # cannot pollute the answer, while the ssh exit status still fails
          # the deploy on a bad layout.
          APPS_OUT=$(ssh_exec "set -e
          APPS_DATA=\$(grep -E '^APPS_DATA=' '$DEPLOY_PATH/.env' 2>/dev/null | tail -1 | cut -d '=' -f2- | tr -d '\"')
          APPS_DATA=\$(printf '%s' \"\$APPS_DATA\" | sed \"s|^~|\$HOME|\")
          case \"\$APPS_DATA\" in
            '$DEPLOY_PATH') echo 'Error: APPS_DATA must not equal DEPLOY_PATH' >&2; exit 1 ;;
            '$DEPLOY_PATH'/*) rel=\${APPS_DATA#\"$DEPLOY_PATH\"/}; printf '__APPS_REL__=%s\n' \"\$rel\" ;;
          esac")
          APPS_REL=$(printf '%s\n' "$APPS_OUT" | sed -n 's/^__APPS_REL__=//p' | tail -1)
          if [ -n "$APPS_REL" ]; then
            case "$APPS_REL" in
              /*|../*|*/../*|*/..|..)
                fail "invalid APPS_DATA path relative to DEPLOY_PATH" ;;
              *[!A-Za-z0-9._/-]*)
                fail "relative APPS_DATA path contains unsupported characters" ;;
            esac
            echo "Protecting APPS_DATA inside the deploy path from --delete: $APPS_REL"
            RSYNC_EXCLUDES+=("--exclude=/$APPS_REL")
          fi

          if [ -n "$SERVER_KEY" ]; then
            RSYNC_RSH="ssh -p $SERVER_PORT -i $SSH_KEY_FILE -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          else
            SSHPASS="$SERVER_PASSWORD"
            export SSHPASS
            RSYNC_RSH="sshpass -e ssh -p $SERVER_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          fi

          echo "Syncing working tree from branch '$BRANCH' to $DEPLOY_TARGET ($SERVER_USER@$SERVER_HOST:$DEPLOY_PATH)"
          rsync -a --delete "${RSYNC_EXCLUDES[@]}" -e "$RSYNC_RSH" ./ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

          # --- restore .env (bootstrap only) --------------------------------
          # Restored only when .env is missing on the target; an existing file
          # is never overwritten. scripts/setup.sh (below) owns .env after the
          # first deploy: it merges new env.example keys in place.
          if [ -n "$ENV_B64" ]; then
            printf '%s' "$ENV_B64" | ssh_exec "
          set -e
          ENV_PATH='$DEPLOY_PATH/.env'
          if [ -f \"\$ENV_PATH\" ]; then
            echo '.env: already present - keeping (restore is bootstrap-only)'
          else
            RESTORE_DIR=\$(mktemp -d)
            trap 'rm -rf \"\$RESTORE_DIR\"' EXIT
            base64 -d > \"\$RESTORE_DIR/env_restore.gz\"
            gunzip -f \"\$RESTORE_DIR/env_restore.gz\"
            cp \"\$RESTORE_DIR/env_restore\" \"\$ENV_PATH\" && chmod 600 \"\$ENV_PATH\"
            echo '.env: restored from secret'
          fi"
          fi

          # --- merge any new env.example variables ---------------------------
          ssh_exec "cd '$DEPLOY_PATH' || exit 1
          [ -f .env ] || { echo 'Error: .env is missing after bootstrap restoration' >&2; exit 1; }
          [ -f scripts/setup.sh ] || { echo 'Error: scripts/setup.sh not found on the target' >&2; exit 1; }
          bash scripts/setup.sh"

          # --- restore acme.json (production, bootstrap only) ----------------
          # Only when acme.json is missing: Traefik owns the file once issued,
          # and a newer encoded secret must never clobber renewed certificates.
          # install sets root:root 600 deterministically; sudo -n fails fast if
          # the deploy user lacks passwordless sudo (server prerequisite).
          if [ "$DEPLOY_TARGET" = prod ] && [ -n "$ACME_B64" ]; then
            printf '%s' "$ACME_B64" | ssh_exec "
          set -e
          APPS_DATA=\$(grep -E '^APPS_DATA=' '$DEPLOY_PATH/.env' | tail -1 | cut -d '=' -f2- | tr -d '\"')
          APPS_DATA=\$(printf '%s' \"\$APPS_DATA\" | sed \"s|^~|\$HOME|\")
          [ -n \"\$APPS_DATA\" ] || APPS_DATA=/opt/containerd
          ACME_PATH=\"\$APPS_DATA/shared/certs/acme.json\"
          if [ -f \"\$ACME_PATH\" ]; then
            echo 'acme.json: already present - keeping (restore is bootstrap-only)'
          else
            RESTORE_DIR=\$(mktemp -d)
            trap 'rm -rf \"\$RESTORE_DIR\"' EXIT
            base64 -d > \"\$RESTORE_DIR/acme_restore.gz\"
            gunzip -f \"\$RESTORE_DIR/acme_restore.gz\"
            sudo -n mkdir -p \"\$(dirname \"\$ACME_PATH\")\"
            sudo -n install -m 600 -o root -g root \"\$RESTORE_DIR/acme_restore\" \"\$ACME_PATH\"
            echo 'acme.json: restored from secret'
          fi"
          fi

          # --- deploy on the remote server ------------------------------------
          # Explicit allowlist (validated against the input options above)
          # instead of service-name prefix filtering, so a future one-shot or
          # foundational webapp* container cannot slip into a deploy. The
          # oCIS ownership initialiser always runs before webappocis. Foundational
          # services (databases, Authentik, Forgejo + runner, Traefik) are
          # deployed manually: deploying Forgejo would kill the runner
          # mid-deploy, and Traefik picks up new containers automatically via its
          # Docker provider. --no-deps guarantees a deploy never starts or
          # recreates them either. aiserv* and obsvce* are excluded per
          # ADR-009 even if the local include set ever lists them again.
          REMOTE_CMD="
          set -eu
          if command -v docker-compose >/dev/null 2>&1; then
            COMPOSE='docker-compose'
          elif docker compose version >/dev/null 2>&1; then
            COMPOSE='docker compose'
          else
            echo 'Error: neither docker-compose nor docker compose is available' >&2
            exit 1
          fi
          case '$DEPLOY_TASK' in
            all)
              \$COMPOSE build webappocisinit
              \$COMPOSE run --rm --no-deps webappocisinit
              \$COMPOSE up -d --build --no-deps webappconf webappocis mailsvstalwart mailsvbulwark
              ;;
            webappocis)
              \$COMPOSE build webappocisinit
              \$COMPOSE run --rm --no-deps webappocisinit
              \$COMPOSE up -d --build --no-deps webappocis
              ;;
            *)
              \$COMPOSE up -d --build --no-deps '$DEPLOY_TASK'
              ;;
          esac
          \$COMPOSE ps"
          ssh_exec "cd '$DEPLOY_PATH' && $REMOTE_CMD"

          echo "Deployment of '$DEPLOY_TASK' from branch '$BRANCH' to $DEPLOY_TARGET completed"
        env:
          BRANCH: ${{ inputs.branch }}
          DEPLOY_TARGET: ${{ inputs.environment }}
          DEPLOY_TASK: ${{ inputs.service }}
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
          STAG_CONFIG: ${{ vars.STAG_CONFIG }}
          STAG_SERVER_PASS: ${{ secrets.STAG_SERVER_PASS }}
          STAG_SERVER_KEY: ${{ secrets.STAG_SERVER_KEY }}
          STAG_B64ENC_ENVS: ${{ secrets.STAG_B64ENC_ENVS }}
          STAG_B64ENC_ACME: ${{ secrets.STAG_B64ENC_ACME }}
          PROD_CONFIG: ${{ vars.PROD_CONFIG }}
          PROD_SERVER_PASS: ${{ secrets.PROD_SERVER_PASS }}
          PROD_SERVER_KEY: ${{ secrets.PROD_SERVER_KEY }}
          PROD_B64ENC_ENVS: ${{ secrets.PROD_B64ENC_ENVS }}
          PROD_B64ENC_ACME: ${{ secrets.PROD_B64ENC_ACME }}
