############### PROJECT ###############
# serviceHub — self-hosted service stack.
#
# Domain files are loaded via `include` (Compose 2.20+).
#
#   compose/route.yml   route*   Edge routing + TLS termination (Traefik)
#   compose/infra.yml   infra*   Databases (MariaDB + PostgreSQL) + Authentik identity
#   compose/devops.yml  devops*  Source control + CI (Forgejo + Actions runner)
#   compose/webapp.yml  webapp*  Homepage / CMS + cloud drive (Confluence + oCIS)
# Per ADR-009 the AI platform (compose/aiserv.yml) and mail platform
# (compose/mailsv.yml) remain outside this OCI deployment. Per ADR-010, the
# self-hosted observability stack (compose/obsvce.yml) is included in OCI scope.
#
# Deploy with: docker compose up -d --build
#
# The project name is pinned so the shared network is always
# `servicehub_subnet` (stable name for inter-service references).
name: servicehub

############### NETWORKS ###############
networks:
    subnet:
        driver: bridge

############### SERVICES ###############
include:
    # --> routing + TLS termination (route)
    - compose/route.yml

    # --> databases + authentication / SSO (infra)
    - compose/infra.yml

    # --> DevOps: source control + CI runners (devops)
    - compose/devops.yml

    # --> web applications (webapp)
    - compose/webapp.yml

    # --> observability: metrics, logs, collection, and dashboards (obsvce)
    - compose/obsvce.yml

    # Email services (mailsv) remain excluded: OCI blocks outbound port 25 and
    # the mail platform is being relocated away from OCI. AI services (aiserv)
    # remain on local infrastructure. Do not add their telemetry to ADR-010.
