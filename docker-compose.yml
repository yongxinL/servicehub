############### PROJECT ###############
# serviceHub — self-hosted service stack.
#
# Domain files are loaded via `include` (Compose 2.20+).
#
#   compose/route.yml   route*   Edge routing + TLS termination (Traefik)
#   compose/infra.yml   infra*   Databases (MariaDB + PostgreSQL) + Authentik identity
#   compose/devops.yml  devops*  Source control + CI (Forgejo + Actions runner)
#   compose/webapp.yml  webapp*  Homepage / CMS + Open WebUI (Confluence + Open WebUI)
#   compose/aiserv.yml  aiserv*  AI agents + LLM inference (Hermes + LiteLLM + llama.cpp)
#   compose/obsvce.yml  obsvce*  Observability (metrics + logs + Grafana)
#   compose/mailsv.yml  mailsv*  Email services (Stalwart mail + Bulwark webmail)
#
# Deploy with: docker compose up -d --build
#
# The project name is pinned so the shared network is always
# `servicehub_subnet` (stable name for inter-service references).
name: servicehub

############### NETWORKS ###############
networks:
    subnet:
        driver: bridge

############### SERVICES ###############
include:
    # --> routing + TLS termination (route)
    - compose/route.yml

    # --> databases + authentication / SSO (infra)
    - compose/infra.yml

    # --> DevOps: source control + CI runners (devops)
    - compose/devops.yml

    # --> web applications (webapp)
    - compose/webapp.yml

    # --> AI agent platform (aiserv)
    - compose/aiserv.yml

    # --> observability: metrics + logs + Grafana (obsvce)
    - compose/obsvce.yml

    # --> email services: mail server + webmail (mailsv)
    - compose/mailsv.yml