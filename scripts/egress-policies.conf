# Container egress policies — ADR-009 decision 5 (see docs/operations/EGRESS-CONTROLS.md)
#
# Format:  <compose service name>   <policy>
#   restricted        RFC1918 destinations plus the host's own public IP
#                     (hairpin to Traefik via login.<domain> etc.); everything
#                     else logged+dropped
#   allow-atlassian   full internet INCLUDING Atlassian (overrides the global block)
#   internet          default: full internet minus the global Atlassian block
#                     (listing a service here is optional, for documentation)
#
# Services are matched by the Compose service label, so container names such as
# servicehub-webappconf-1 do not matter. Every container — listed here or not —
# is still subject to the global Atlassian block.

webappconf          restricted
