apiVersion: 1

groups:
  # ============================================================
  # SERVICEHUB INFRASTRUCTURE CRITICAL — immediate response
  # ============================================================
  - orgId: 1
    name: servicehub-infrastructure-critical
    folder: ServiceHub Alerts
    interval: 60s
    rules:
      # ------------------------------------------------------------------
      # Filesystem critically full (>95%)
      # ------------------------------------------------------------------
      - uid: servicehub-fs-critical
        title: Filesystem critically full
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "100 * (1 - node_filesystem_avail_bytes{mountpoint!=\"/cdrom\",fstype!~\"^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fuse.*|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|ramfs|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$\"} / node_filesystem_size_bytes{mountpoint!=\"/cdrom\",fstype!~\"^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fuse.*|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|ramfs|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 95
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          service: host
        annotations:
          summary: "A filesystem is above 95% capacity"
          runbook: "Check disk usage on affected mountpoint; investigate log growth, container images, or volume expansion"

      # ------------------------------------------------------------------
      # Inode exhaustion (>95%)
      # ------------------------------------------------------------------
      - uid: servicehub-inode-critical
        title: Inode exhaustion imminent
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "100 * (1 - node_filesystem_files_free{mountpoint!=\"/cdrom\",fstype!~\"^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fuse.*|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|ramfs|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$\"} / node_filesystem_files{mountpoint!=\"/cdrom\",fstype!~\"^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fuse.*|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|ramfs|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 95
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          service: host
        annotations:
          summary: "A filesystem is above 95% inode utilization"
          runbook: "Investigate large number of small files; check container logs, temp directories, or mail queues"

      # ------------------------------------------------------------------
      # Filesystem became read-only
      # ------------------------------------------------------------------
      - uid: servicehub-fs-readonly
        title: Filesystem became read-only
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "max(node_filesystem_readonly{mountpoint!=\"/cdrom\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          service: host
        annotations:
          summary: "A monitored filesystem is read-only"
          runbook: "Investigate filesystem errors; check dmesg for I/O errors; may require fsck or disk replacement"

      # ------------------------------------------------------------------
      # Traefik internal readiness failed
      # ------------------------------------------------------------------
      - uid: servicehub-traefik-critical
        title: Traefik unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(probe_success{service=\"traefik\",probe_type=\"readiness\",target_class=\"internal\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: traefik
        annotations:
          summary: "Traefik readiness probe failed"
          runbook: "Check Traefik container logs; verify /ping endpoint; restart Traefik if necessary"

      # ------------------------------------------------------------------
      # Authentik internal readiness failed
      # ------------------------------------------------------------------
      - uid: servicehub-authentik-critical
        title: Authentik unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(probe_success{service=\"authentik\",probe_type=\"readiness\",target_class=\"internal\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: authentik
        annotations:
          summary: "Authentik server or worker readiness probe failed"
          runbook: "Check Authentik container logs; verify /-/health/ready/ endpoint; check PostgreSQL connectivity"

      # ------------------------------------------------------------------
      # Confluence internal readiness failed
      # ------------------------------------------------------------------
      - uid: servicehub-confluence-critical
        title: Confluence unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(probe_success{service=\"confluence\",probe_type=\"readiness\",target_class=\"internal\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: confluence
        annotations:
          summary: "Confluence readiness probe failed"
          runbook: "Check Confluence container logs; verify /status endpoint; check PostgreSQL connectivity"

      # ------------------------------------------------------------------
      # Forgejo internal readiness failed
      # ------------------------------------------------------------------
      - uid: servicehub-forgejo-critical
        title: Forgejo unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(probe_success{service=\"forgejo\",probe_type=\"readiness\",target_class=\"internal\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: forgejo
        annotations:
          summary: "Forgejo readiness probe failed"
          runbook: "Check Forgejo container logs; verify /api/healthz endpoint; check PostgreSQL connectivity"

      # ------------------------------------------------------------------
      # oCIS internal readiness failed
      # ------------------------------------------------------------------
      - uid: servicehub-ocis-critical
        title: ownCloud Infinite Scale unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(probe_success{service=\"ocis\",probe_type=\"readiness\",target_class=\"internal\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: ocis
        annotations:
          summary: "oCIS readiness probe failed"
          runbook: "Check oCIS container logs; verify /status.php endpoint; check MariaDB/PostgreSQL connectivity"

      # ------------------------------------------------------------------
      # Container restart loop (changes in start time over 10m)
      # ------------------------------------------------------------------
      - uid: servicehub-container-restart-loop
        title: Container restart loop
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "changes(container_start_time_seconds{compose_service=~\"infraauth|infraauthwrk|webappconf|devopsforgejo|webappocis|routetraefik|obsvcegrafana|obsvcevm|obsvcevlogs|obsvcealloy|inframariadb|infrapgsql|devopsrunner\"}[10m])"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          service: docker
        annotations:
          summary: "A service container is restarting frequently"
          runbook: "Check container logs for crash cause; verify resource limits and dependencies"

      # ------------------------------------------------------------------
      # Container OOM event
      # ------------------------------------------------------------------
      - uid: servicehub-container-oom
        title: Container OOM event
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "increase(container_oom_events_total{compose_service=~\"infraauth|infraauthwrk|webappconf|devopsforgejo|webappocis|routetraefik|obsvcegrafana|obsvcevm|obsvcevlogs|obsvcealloy|inframariadb|infrapgsql|devopsrunner\"}[5m])"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          service: docker
        annotations:
          summary: "A container experienced an OOM kill"
          runbook: "Increase container memory limit or investigate memory leak in the application"

      # ------------------------------------------------------------------
      # Telemetry remote-write failure
      # ------------------------------------------------------------------
      - uid: servicehub-telemetry-ingestion
        title: Telemetry remote-write failed
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "sum(increase(prometheus_remote_storage_samples_failed_total[5m]))"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: observability
        annotations:
          summary: "Alloy remote-write to VictoriaMetrics is failing"
          runbook: "Check Alloy logs for remote-write errors; verify VictoriaMetrics health and disk space"

      # ------------------------------------------------------------------
      # PostgreSQL unavailable
      # ------------------------------------------------------------------
      - uid: servicehub-postgresql-critical
        title: PostgreSQL unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(pg_up)"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "PostgreSQL exporter reports PostgreSQL is down"
          runbook: "Check PostgreSQL container; verify Alloy postgres exporter connectivity; check pg_up"

  # ============================================================
  # SERVICEHUB CAPACITY WARNING — sustained pressure
  # ============================================================
  - orgId: 1
    name: servicehub-capacity-warning
    folder: ServiceHub Alerts
    interval: 60s
    rules:
      # ------------------------------------------------------------------
      # Filesystem approaching capacity (>85%)
      # ------------------------------------------------------------------
      - uid: servicehub-fs-warning
        title: Filesystem approaching capacity
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "100 * (1 - node_filesystem_avail_bytes{mountpoint!=\"/cdrom\",fstype!~\"^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fuse.*|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|ramfs|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$\"} / node_filesystem_size_bytes{mountpoint!=\"/cdrom\",fstype!~\"^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|tmpfs|fuse.*|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|ramfs|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          service: host
        annotations:
          summary: "A filesystem is above 85% capacity"
          runbook: "Plan disk expansion or cleanup; investigate growth rate"

      # ------------------------------------------------------------------
      # Sustained CPU pressure
      # ------------------------------------------------------------------
      - uid: servicehub-cpu-pressure
        title: Sustained CPU pressure
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "rate(node_pressure_cpu_waiting_seconds_total[5m])"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Sustained CPU pressure detected (PSI waiting > 0.2)"
          runbook: "Investigate CPU-intensive processes; consider scaling or optimizing workloads"

      # ------------------------------------------------------------------
      # Sustained memory pressure
      # ------------------------------------------------------------------
      - uid: servicehub-memory-pressure
        title: Sustained memory pressure
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "rate(node_pressure_memory_waiting_seconds_total[5m])"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Sustained memory pressure detected (PSI waiting > 0.2)"
          runbook: "Investigate memory usage; check for leaks or consider adding swap"

      # ------------------------------------------------------------------
      # Sustained I/O pressure
      # ------------------------------------------------------------------
      - uid: servicehub-io-pressure
        title: Sustained I/O pressure
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "rate(node_pressure_io_waiting_seconds_total[5m])"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Sustained I/O pressure detected (PSI waiting > 0.2)"
          runbook: "Investigate disk I/O; check for excessive logging, swap activity, or slow storage"

      # ------------------------------------------------------------------
      # TLS certificate approaching expiry (<14 days)
      # ------------------------------------------------------------------
      - uid: servicehub-tls-expiry
        title: TLS certificate approaching expiry
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min by (service) (probe_ssl_earliest_cert_expiry{component=\"probe\",probe_type=\"https\",target_class=\"external\"} - time())"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1209600
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 1h
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          service: edge
        annotations:
          summary: "A TLS certificate expires within 14 days"
          runbook: "Renew the affected certificate; verify cert-manager or manual renewal process"

      # ------------------------------------------------------------------
      # Sustained Traefik HTTP 5xx rate (>5% of requests)
      # ------------------------------------------------------------------
      - uid: servicehub-traefik-5xx
        title: Sustained Traefik HTTP 5xx rate
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "(sum(rate(traefik_service_requests_total{code=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(traefik_service_requests_total[5m])), 1)"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          service: edge
        annotations:
          summary: "Traefik HTTP 5xx rate exceeds 5%"
          runbook: "Check upstream service health; review Traefik access logs for error patterns"
      - uid: servicehub-traefik-latency
        title: Sustained Traefik latency degradation
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket[5m])))"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          service: edge
        annotations:
          summary: "Traefik p95 latency exceeds 2 seconds"
          runbook: "Check upstream service latency; investigate resource saturation or network issues"

      # ------------------------------------------------------------------
      # Forgejo Actions Runner unavailable (last seen > 5m)
      # ------------------------------------------------------------------
      - uid: servicehub-runner-warning
        title: Forgejo Actions Runner unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "max(time() - container_last_seen{compose_service=\"devopsrunner\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: warning
          service: forgejo
          component: runner
        annotations:
          summary: "ForgeJo Actions Runner has not reported in 5 minutes"
          runbook: "Check runner container logs; verify ForgeJo connectivity; restart runner if necessary"

  # ============================================================
  # SERVICEHUB OBSERVABILITY PIPELINE — self-monitoring
  # ============================================================
  - orgId: 1
    name: servicehub-observability-pipeline
    folder: ServiceHub Alerts
    interval: 60s
    rules:
      # ------------------------------------------------------------------
      # VictoriaMetrics unavailable
      # ------------------------------------------------------------------
      - uid: servicehub-victoriametrics-critical
        title: VictoriaMetrics unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(probe_success{service=\"victoriametrics\",probe_type=\"readiness\",target_class=\"internal\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: victoriametrics
        annotations:
          summary: "VictoriaMetrics readiness probe failed"
          runbook: "Check VictoriaMetrics container logs; verify /health endpoint; check disk space"

      # ------------------------------------------------------------------
      # VictoriaLogs unavailable
      # ------------------------------------------------------------------
      - uid: servicehub-victorialogs-critical
        title: VictoriaLogs unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(probe_success{service=\"victorialogs\",probe_type=\"readiness\",target_class=\"internal\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: victorialogs
        annotations:
          summary: "VictoriaLogs readiness probe failed"
          runbook: "Check VictoriaLogs container logs; verify /health endpoint; check disk space"

      # ------------------------------------------------------------------
      # Grafana internal readiness failed
      # ------------------------------------------------------------------
      - uid: servicehub-grafana-critical
        title: Grafana unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(probe_success{service=\"grafana\",probe_type=\"readiness\",target_class=\"internal\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: grafana
        annotations:
          summary: "Grafana internal readiness probe failed"
          runbook: "Check Grafana container logs; verify /api/health endpoint; check datasource connectivity"

      # ------------------------------------------------------------------
      # Alloy unavailable
      # ------------------------------------------------------------------
      - uid: servicehub-alloy-critical
        title: Alloy unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(up{job=\"alloy\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: alloy
        annotations:
          summary: "Alloy telemetry collector is down"
          runbook: "Check Alloy container logs; verify /health endpoint; check Alloy configuration syntax"

      # ------------------------------------------------------------------
      # Alloy config load failed
      # ------------------------------------------------------------------
      - uid: servicehub-alloy-config-failed
        title: Alloy configuration load failed
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "alloy_config_last_load_successful"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.5
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: alloy
        annotations:
          summary: "Alloy configuration failed to load"
          runbook: "Check Alloy logs for config validation errors; fix config.alloy or blackbox.yml"

      # ------------------------------------------------------------------
      # Scrape target down (any core job)
      # ------------------------------------------------------------------
      - uid: servicehub-scrape-failure
        title: Prometheus scrape target down
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: "min(up{job=~\"obstack|cadvisor|traefik|alloy|internal|public|authentik_server|authentik_worker|ocis_proxy|postgresql\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 3m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: observability
        annotations:
          summary: "A core Prometheus scrape target is down"
          runbook: "Identify the failing job from scrape health dashboard; check target service and network"

      # ------------------------------------------------------------------
      # Log ingestion stopped (VictoriaLogs)
      # ------------------------------------------------------------------
      - uid: servicehub-log-ingestion-stopped
        title: Log ingestion stopped
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victorialogs
            model:
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: "{project=\"servicehub\"} | stats count() as logs"
              queryType: statsRange
              intervalMs: 60000
              maxDataPoints: 100
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: eq
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: observability
        annotations:
          summary: "No logs ingested into VictoriaLogs for 5 minutes"
          runbook: "Check Alloy loki.write component; verify Docker socket access; check VictoriaLogs health"