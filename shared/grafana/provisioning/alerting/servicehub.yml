            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket[5m])))"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [2], type: gt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels: {severity: warning, service: edge}
        annotations:
          summary: "Traefik p95 response latency exceeds two seconds"
          runtime_status: "Implemented in configuration; runtime verification pending"
