                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical, service: authentik}
        annotations:
          summary: "Authentik server or worker readiness probe failed"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-confluence-critical
