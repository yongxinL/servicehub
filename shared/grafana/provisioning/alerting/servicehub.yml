        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "sum(increase(prometheus_remote_storage_samples_failed_total[5m]))"
              intervalMs: 1000
