apiVersion: 1

groups:
  - orgId: 1
    name: servicehub-infrastructure-critical
    folder: ServiceHub Alerts
    interval: 60s
    rules:
      - uid: servicehub-fs-critical
        title: Filesystem critically full
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "100 * (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes)"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [95], type: gt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical, service: host}
        annotations:
          summary: "A filesystem is above 95% capacity"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-inode-critical
        title: Inode exhaustion imminent
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "100 * (1 - node_filesystem_files_free / node_filesystem_files)"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [95], type: gt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical, service: host}
        annotations:
          summary: "A filesystem is above 95% inode utilization"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-fs-readonly
        title: Filesystem became read-only
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "node_filesystem_readonly"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical, service: host}
        annotations:
          summary: "A monitored filesystem is read-only"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-traefik-critical
        title: Traefik unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "probe_success{service=\"traefik\"}"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical, service: traefik}
        annotations:
          summary: "Traefik readiness probe failed"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-authentik-critical
        title: Authentik unavailable
