            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical, service: confluence}
        annotations:
          summary: "Confluence readiness probe failed"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-forgejo-critical
        title: Forgejo unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "probe_success{service=\"forgejo\"}"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical, service: forgejo}
        annotations:
          summary: "Forgejo readiness probe failed"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-ocis-critical
        title: ownCloud Infinite Scale unavailable
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "probe_success{service=\"ocis\"}"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels: {severity: critical, service: ocis}
        annotations:
          summary: "oCIS readiness probe failed"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-container-restart-loop
        title: Container restart loop
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "changes(container_start_time_seconds{name!=\"\"}[10m])"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [2], type: gt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels: {severity: critical, service: docker}
        annotations:
          summary: "A container started more than twice in ten minutes"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-container-oom
        title: Container OOM event
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "increase(container_oom_events_total{name!=\"\"}[5m])"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
