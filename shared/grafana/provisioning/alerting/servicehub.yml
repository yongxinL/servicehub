                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels: {severity: warning, service: host}
        annotations:
          summary: "A filesystem is above 85% capacity"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-cpu-pressure
        title: Sustained CPU pressure
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "rate(node_pressure_cpu_waiting_seconds_total[5m])"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [0.2], type: gt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels: {severity: warning, service: host}
        annotations:
          summary: "CPU pressure-stall waiting time is sustained"
          runtime_status: "Implemented in configuration; runtime verification pending"
