                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels: {severity: critical, service: docker}
        annotations:
          summary: "A container recorded an out-of-memory event"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-telemetry-ingestion
