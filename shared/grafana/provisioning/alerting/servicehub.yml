      - uid: servicehub-tls-expiry
        title: TLS certificate approaching expiry
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "min by (service) (probe_ssl_earliest_cert_expiry{component=\"public-probe\"} - time())"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator: {params: [1209600], type: lt}
                  operator: {type: and}
                  query: {params: ["A"]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: "-100"}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        for: 1h
        noDataState: NoData
        execErrState: Error
        labels: {severity: warning, service: edge}
        annotations:
          summary: "A public HTTPS certificate expires in 14 days or less"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-traefik-5xx
        title: Sustained Traefik HTTP 5xx rate
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: "sum(rate(traefik_service_requests_total{code=~\"5..\"}[5m])) / clamp_min(sum(rate(traefik_service_requests_total[5m])), 1)"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: "-100"
            model:
