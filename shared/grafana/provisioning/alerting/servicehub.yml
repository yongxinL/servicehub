        for: 10m
        noDataState: NoData
        execErrState: Error
        labels: {severity: warning, service: edge}
        annotations:
          summary: "Traefik 5xx responses exceed 5% for ten minutes"
          runtime_status: "Implemented in configuration; runtime verification pending"
      - uid: servicehub-traefik-latency
