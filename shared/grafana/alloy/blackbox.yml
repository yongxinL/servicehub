modules:
    http_internal_2xx:
        prober: http
        timeout: 5s
        http:
            preferred_ip_protocol: ip4
            valid_status_codes:
                - 200
    https_public_2xx:
        prober: http
        timeout: 10s
        http:
            preferred_ip_protocol: ip4
            valid_status_codes:
                - 200
            tls_config:
                insecure_skip_verify: false
    https_expected_redirect:
        prober: http
        timeout: 10s
        http:
            method: GET
            preferred_ip_protocol: ip4
            valid_status_codes:
                - 301
                - 302
                - 303
                - 307
                - 308
            follow_redirects: false
            fail_if_not_ssl: true
            tls_config:
                insecure_skip_verify: false
    https_admin_restricted:
        prober: http
        timeout: 10s
        http:
            method: GET
            preferred_ip_protocol: ip4
            valid_status_codes:
                - 200
                - 403
            follow_redirects: false
            fail_if_not_ssl: true
            tls_config:
                insecure_skip_verify: false
