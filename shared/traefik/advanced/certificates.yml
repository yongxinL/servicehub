################################################################
# Dynamic configuration
# default certificates
#
# NOTE: This file is used for self-signed certificates.
# To use self-signed certificates instead of Let's Encrypt:
#   1. Place your certificate files in shared/traefik/advanced/selfsigncert/
#      (they are git-crypt encrypted in the repository)
#   2. The directory is mounted into the container at
#      /traefik/config/advanced/selfsigncert/
#   3. Rename the files below to match your certificate names
#   4. Ensure CERTRESOLVER is empty so routers fall back to this default cert
#
# Example: certFile: /traefik/config/advanced/selfsigncert/selfcert.pem
#          keyFile: /traefik/config/advanced/selfsigncert/selfcert.key
################################################################

tls:
    stores:
        default:
            defaultCertificate:
                certFile: /traefik/config/advanced/selfsigncert/selfcert.pem
                keyFile: /traefik/config/advanced/selfsigncert/selfcert.key
