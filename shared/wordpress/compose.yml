# Optional WordPress homepage — NOT included by docker-compose.yml.
#
# To switch the default homepage from Confluence to WordPress:
#   1. Stop webappconf:  docker compose stop webappconf
#   2. In docker-compose.yml, replace `- compose/webapp.yml` with `- shared/wordpress/compose.yml`
#   3. Ensure MARIADB_DATABASES="${WORKSPACE_DBNAME}" in .env, then: docker compose up -d --build
#
# Docs: docs/products/wordpress.md
services:
    # webappwpress — WordPress homepage / CMS. Docs: docs/products/wordpress.md
    webappwpress:
        build:
            context: .
        depends_on:
            routetraefik:
                condition: service_healthy
            inframariadb:
                condition: service_healthy
            infraauth:
                condition: service_started
        environment:
            - WORDPRESS_DB_HOST=${MARIADB_HOST}
            - WORDPRESS_DB_NAME=${WORKSPACE_DBNAME}
            - WORDPRESS_DB_USER=${DB_ADMIN_USER}
            - WORDPRESS_DB_PASSWORD=${DB_ADMIN_PASSWORD}
        image: webappwpress:latest
        labels:
            # Enable Traefik for this container
            - "traefik.enable=true"
            # Use the 'websecure' (HTTPS) entry point
            - "traefik.http.routers.webappwpress.entrypoints=websecure"
            # Match incoming requests on a specific hostname (plus the apex domain)
            - "traefik.http.routers.webappwpress.rule=Host(`${WORKSPACE_DOMAIN}`) || Host(`${DOMAIN_NAME}`)"
            # Assign the router to a named Traefik service
            - "traefik.http.routers.webappwpress.service=webappwpress"
            # Define the internal container port for routing
            - "traefik.http.services.webappwpress.loadbalancer.server.port=80"
            # Enable TLS on this router
            - "traefik.http.routers.webappwpress.tls=true"
            # Use Let's Encrypt for certificate management or Self-signed certificate
            - "traefik.http.routers.webappwpress.tls.certresolver=${CERTRESOLVER}"
        networks:
            - subnet
        restart: unless-stopped
        volumes:
            - ${APPS_DATA}/webapp/wordpress:/var/www/html
